  const m = openModal({
    title: 'Detalhes do serviço', dismiss: true,
    body: `<div class="det-head">${s.foto_url ? `<img class="big" src="${esc(s.foto_url)}" alt="">` : `<div class="big">${ico('tool')}</div>`}
      <div style="flex:1"><h2>${esc(s.nome)}</h2><div style="color:var(--muted)">${esc(s.especificacao)}</div>
      <div style="margin-top:6px">${s.categoria ? `<span class="chip">${esc(s.categoria)}</span>` : ''}</div></div></div>
      <div class="compo"><b style="font-size:13px">Composição do preço</b>
        <div class="row" style="margin-top:6px"><span>Valor da hora</span><b>${brl(s.valor_hora)}</b></div>
        <div class="row"><span>Horas trabalhadas</span><b>${nf(s.horas_trabalhadas)} h</b></div>
        <div class="row tot"><span><b style="color:var(--text)">Preço final</b></span><b>${brl(s.preco)}</b></div></div>
      <div class="sec-t" style="margin-top:20px">${ico('hist')} Histórico de preços</div><div data-hist></div>`,
    foot: `${isAdmin() ? `<button class="btn danger" id="dsdel" style="margin-right:auto">${ico('trash')} Excluir</button>` : ''}<button class="btn" data-close>Fechar</button><button class="btn primary" id="dsed">${ico('edit')} Editar</button>`,
  });
  pintarHistorico($('[data-hist]', m), 'servico', s.id);
  $('#dsed', m).onclick = () => { m.close(); formServico(s).catch(falha); };
  if ($('#dsdel', m)) $('#dsdel', m).onclick = () => { m.close(); excluirServico(s); };
}

/* -------------------------- BASE DE CÁLCULO ------------------------ */
Views.base = async (v, args, vivo) => {
  const opcoes = [
    { id: 'produto', t: 'PRODUTO', d: 'Materiais + horas + lucro', i: 'box' },
    { id: 'servico', t: 'SERVIÇO', d: 'Valor da hora × horas trabalhadas', i: 'tool' },
    { id: 'completo', t: 'COMPLETO', d: 'Produtos e serviços juntos', i: 'layers' },
  ].filter(o => o.id === 'produto' ? temProd() : o.id === 'servico' ? temServ() : temProd() && temServ());
  let aba = opcoes.some(o => o.id === args[0]) ? args[0] : '';
  if (!aba && opcoes.length === 1) aba = opcoes[0].id;
  const cab = `<div class="page-h"><div><h1>Base de Cálculo</h1><p>Formação de preço de produtos e serviços.</p></div></div>
    <div class="opts ${aba ? 'compact' : ''}" style="grid-template-columns:repeat(${opcoes.length},minmax(0,1fr))">${opcoes.map(o => `<a class="card opt ${o.id === aba ? 'on' : ''}" href="#/base/${o.id}">
      <div class="ic">${ico(o.i)}</div><div><b>${o.t}</b><p>${o.d}</p></div></a>`).join('')}</div>`;
  if (!aba) { v.innerHTML = cab + `<div class="card"><div class="empty">${ico('calc')}<div>Escolha uma das opções acima.</div></div></div>`; return; }

  const [produtos, servicos] = await Promise.all([Dados.produtos(), Dados.servicos()]);
  if (!vivo()) return;
  const st = { busca: '', cat: '', tipo: '' };
  const cats = categoriasDe(aba === 'produto' ? produtos : aba === 'servico' ? servicos : [...produtos, ...servicos]);
  v.innerHTML = cab + `<div class="toolbar">
      <div class="search">${ico('search')}<input class="f" id="bbusca" placeholder="Pesquisar…"></div>
      <select class="f" id="bcat">${optsCat(cats)}</select>
      ${aba === 'completo' ? `<div class="seg" id="btipo"><button class="on" data-t="">Todos</button><button data-t="produto">Produtos</button><button data-t="servico">Serviços</button></div>` : ''}
      <span style="flex:1"></span>
      ${aba !== 'completo' ? `<button class="btn primary" id="bcad">${ico('plus')} CADASTRAR</button>` : ''}
    </div><div id="bconteudo"></div>`;
  const alvo = $('#bconteudo', v);
  const filtra = (lista) => { const b = norm(st.busca); return lista.filter(x => (!b || norm(x.nome + ' ' + x.especificacao).includes(b)) && (!st.cat || x.categoria === st.cat)); };
  const acoes = (tipo) => `<td class="act"><button class="icon-btn" data-a="edit" data-k="${tipo}" title="Ver composição / editar">${ico('edit')}</button>${isAdmin() ? `<button class="icon-btn bad" data-a="del" data-k="${tipo}" title="Excluir">${ico('trash')}</button>` : ''}</td>`;

  const pintar = () => {
    if (aba === 'produto') {
      const l = filtra(produtos);
      alvo.innerHTML = `<div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Produto</th><th>Especificação</th><th>Categoria</th><th class="num">Materiais</th><th class="num">Horas</th><th class="num">Custo</th><th class="num">Lucro</th><th class="num">Preço final</th><th class="act"></th></tr></thead><tbody>
      ${l.length ? l.map(p => `<tr class="click" data-id="${p.id}"><td class="first"><b>${esc(p.nome)}</b></td><td data-l="Especificação" class="muted">${esc(p.especificacao) || '—'}</td>
        <td data-l="Categoria">${p.categoria ? `<span class="chip">${esc(p.categoria)}</span>` : '—'}</td>
        <td data-l="Materiais" class="num">${brl(p.custo_materiais)}</td><td data-l="Horas" class="num">${brl(p.custo_horas)}</td><td data-l="Custo" class="num">${brl(p.custo)}</td>
        <td data-l="Lucro" class="num">${nf(p.lucro_percentual)}%</td><td data-l="Preço final" class="num"><b>${brl(p.preco_venda)}</b></td>${acoes('produto')}</tr>`).join('')
        : emptyRow(9, produtos.length ? 'Nada encontrado.' : 'Nenhum produto. Clique em CADASTRAR.', 'box')}</tbody></table></div></div>`;
    } else if (aba === 'servico') {
      const l = filtra(servicos);
      alvo.innerHTML = `<div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Serviço</th><th>Especificação</th><th>Categoria</th><th class="num">Horas (R$)</th><th class="num">Horas trabalhadas</th><th class="num">Preço final</th><th class="act"></th></tr></thead><tbody>
      ${l.length ? l.map(s => `<tr class="click" data-id="${s.id}"><td class="first"><b>${esc(s.nome)}</b></td><td data-l="Especificação" class="muted">${esc(s.especificacao) || '—'}</td>
        <td data-l="Categoria">${s.categoria ? `<span class="chip">${esc(s.categoria)}</span>` : '—'}</td>
        <td data-l="Valor da hora" class="num">${brl(s.valor_hora)}</td><td data-l="Horas" class="num">${nf(s.horas_trabalhadas)} h</td>
        <td data-l="Preço final" class="num"><b>${brl(s.preco)}</b></td>${acoes('servico')}</tr>`).join('')
        : emptyRow(7, servicos.length ? 'Nada encontrado.' : 'Nenhum serviço. Clique em CADASTRAR.', 'tool')}</tbody></table></div></div>`;
    } else {
      const lp = st.tipo === 'servico' ? [] : filtra(produtos).map(p => ({ ...p, _k: 'produto', _preco: +p.preco_venda, _custo: +p.custo,
        _comp: textoComposicao(p) }));
      const ls = st.tipo === 'produto' ? [] : filtra(servicos).map(s => ({ ...s, _k: 'servico', _preco: +s.preco, _custo: null,
        _comp: `${brl(s.valor_hora)}/h × ${nf(s.horas_trabalhadas)} h` }));
      const l = [...lp, ...ls].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      const mediaLucro = lp.length ? lp.reduce((s, p) => s + Number(p.lucro_percentual), 0) / lp.length : 0;
      alvo.innerHTML = `<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
          <div class="card kpi"><div class="ic">${ico('box')}</div><div><small>Produtos</small><b>${lp.length}</b></div></div>
          <div class="card kpi"><div class="ic">${ico('tool')}</div><div><small>Serviços</small><b>${ls.length}</b></div></div>
          <div class="card kpi"><div class="ic ok">${ico('chart')}</div><div><small>Lucro médio (produtos)</small><b>${nf(mediaLucro)}%</b></div></div></div>
        <div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Tipo</th><th>Nome</th><th>Especificação</th><th>Categoria</th><th>Composição</th><th class="num">Custo</th><th class="num">Preço final</th><th class="act"></th></tr></thead><tbody>
        ${l.length ? l.map(x => `<tr class="click" data-id="${x.id}" data-k="${x._k}"><td data-l="Tipo"><span class="badge ${x._k === 'produto' ? 'info' : 'ok'}">${x._k === 'produto' ? 'Produto' : 'Serviço'}</span></td>
          <td class="first"><b>${esc(x.nome)}</b></td><td data-l="Especificação" class="muted">${esc(x.especificacao) || '—'}</td>
          <td data-l="Categoria">${x.categoria ? `<span class="chip">${esc(x.categoria)}</span>` : '—'}</td>
          <td data-l="Composição" class="muted" style="font-size:13px">${x._comp}</td>
          <td data-l="Custo" class="num">${x._custo === null ? '—' : brl(x._custo)}</td><td data-l="Preço final" class="num"><b>${brl(x._preco)}</b></td>${acoes(x._k)}</tr>`).join('')
          : emptyRow(8, 'Nada encontrado.', 'layers')}</tbody></table></div></div>`;
    }
  };
  pintar();
  $('#bbusca', v).oninput = debounce(e => { st.busca = e.target.value; pintar(); }, 150);
  $('#bcat', v).onchange = e => { st.cat = e.target.value; pintar(); };
  if ($('#btipo', v)) $$('#btipo button', v).forEach(b => b.onclick = () => { st.tipo = b.dataset.t; $$('#btipo button', v).forEach(x => x.classList.toggle('on', x === b)); pintar(); });
  const cadastrar = () => (aba === 'produto' ? formProduto(null, { modo: 'base' }) : formServico(null)).catch(falha);
  if ($('#bcad', v)) $('#bcad', v).onclick = cadastrar;
  alvo.onclick = e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const k = tr.dataset.k || aba;
    const item = (k === 'produto' ? produtos : servicos).find(x => x.id === tr.dataset.id);
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'del') return k === 'produto' ? excluirProduto(item) : excluirServico(item);
    (k === 'produto' ? formProduto(item, { modo: 'base' }) : formServico(item)).catch(falha);
  };
  if (args[1] === 'novo') { history.replaceState(null, '', '#/base/' + aba); cadastrar(); }
};

/* --------------------------- FORNECEDORES -------------------------- */
const linkTel = t => t ? `<a href="tel:${esc(onlyDigits(t))}">${ico('phone')} ${esc(t)}</a>` : '';
const linkWa = t => onlyDigits(t).length >= 10 ? `<a href="https://wa.me/${onlyDigits(t).length <= 11 ? '55' : ''}${onlyDigits(t)}" target="_blank" rel="noopener">${ico('wa')} WhatsApp</a>` : '';
const linkMail = e => e ? `<a href="mailto:${esc(e)}">${ico('mail')} ${esc(e)}</a>` : '';

function formPessoa(tipo, reg = null, aoSalvar = recarregar) {
  const forn = tipo === 'fornecedores';
  const r = reg || {}; const novo = !r.id;
  const m = openModal({
    title: (novo ? 'Novo ' : 'Editar ') + (forn ? 'fornecedor' : 'cliente'),
    body: `<form id="fpe" autocomplete="off"><div class="grid g2">
      <div class="field spanall"><label>Nome *</label><input class="f" name="nome" required maxlength="160" value="${esc(r.nome)}"></div>
      <div class="field"><label>Telefone</label><input class="f" name="telefone" inputmode="tel" maxlength="40" value="${esc(r.telefone)}"></div>
      <div class="field"><label>E-mail</label><input class="f" type="email" name="email" maxlength="160" value="${esc(r.email)}"></div>
      ${forn ? `<div class="field"><label>Atendente responsável</label><input class="f" name="atendente" maxlength="120" value="${esc(r.atendente)}"></div>`
             : `<div class="field"><label>CPF / CNPJ</label><input class="f" name="documento" maxlength="20" value="${esc(r.documento)}"></div>`}
      <div class="field ${forn ? '' : 'span2'}"><label>Endereço</label><input class="f" name="endereco" maxlength="300" value="${esc(r.endereco)}"></div>
      <div class="field spanall"><label>Observação</label><textarea class="f" name="observacao" maxlength="1000">${esc(r.observacao)}</textarea></div>
    </div></form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="bspe">${ico('check')} Salvar</button>`,
  });
  const f = $('#fpe', m);
  if (!forn) f.documento.addEventListener('blur', () => f.documento.value = fmtDoc(f.documento.value));
  $('#bspe', m).onclick = () => {
    if (!f.reportValidity()) return;
    busy($('#bspe', m), async () => {
      try {
        const d = { nome: f.nome.value.trim(), telefone: f.telefone.value.trim(), email: f.email.value.trim().toLowerCase(),
          endereco: f.endereco.value.trim(), observacao: f.observacao.value.trim() };
        if (forn) d.atendente = f.atendente.value.trim(); else d.documento = f.documento.value.trim();
        const salvo = novo ? await q(sb.from(tipo).insert(d).select().single()) : await q(sb.from(tipo).update(d).eq('id', r.id).select().single());
        m.close(); toast((forn ? 'Fornecedor' : 'Cliente') + (novo ? ' cadastrado.' : ' atualizado.'), 'ok'); aoSalvar(salvo);
      } catch (e) { falha(e); }
    });
  };
}
async function excluirPessoa(tipo, r) {
  const forn = tipo === 'fornecedores';
  if (!await confirmar(`Excluir ${forn ? 'o fornecedor' : 'o cliente'} <b>${esc(r.nome)}</b>?<br><br><span style="color:var(--muted);font-size:13px">${forn ? 'O histórico de compras é preservado (sem o vínculo com o fornecedor).' : 'As vendas já realizadas são preservadas com o nome do cliente.'}</span>`, { ok: 'Excluir', danger: true })) return;
  try { await q(sb.from(tipo).delete().eq('id', r.id)); toast('Excluído.', 'ok'); recarregar(); } catch (e) { falha(e); }
}

Views.fornecedores = async (v, _, vivo) => {
  const lista = await Dados.fornecedores();
  if (!vivo()) return;
  let busca = '';
  v.innerHTML = `<div class="page-h"><div><h1>Fornecedores</h1><p>${lista.length} fornecedor(es)</p></div>
    <div class="actions"><button class="btn primary" id="fnovo">${ico('plus')} Novo fornecedor</button></div></div>
    <div class="toolbar"><div class="search">${ico('search')}<input class="f" id="fbusca" placeholder="Pesquisar por nome, telefone, e-mail ou atendente…"></div></div>
    <div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Atendente</th><th>Endereço</th><th class="act"></th></tr></thead><tbody id="ftb"></tbody></table></div></div>`;
  const pintar = () => {
    const b = norm(busca);
    const l = lista.filter(f => !b || norm([f.nome, f.telefone, f.email, f.atendente, f.endereco].join(' ')).includes(b));
    $('#ftb', v).innerHTML = l.length ? l.map(f => `<tr class="click" data-id="${f.id}"><td class="first"><b>${esc(f.nome)}</b></td>
      <td data-l="Telefone">${esc(f.telefone) || '—'}</td><td data-l="E-mail">${esc(f.email) || '—'}</td><td data-l="Atendente">${esc(f.atendente) || '—'}</td>
      <td data-l="Endereço" class="muted mh">${esc(f.endereco) || '—'}</td>
      <td class="act"><button class="icon-btn" data-a="edit" title="Editar">${ico('edit')}</button>${isAdmin() ? `<button class="icon-btn bad" data-a="del" title="Excluir">${ico('trash')}</button>` : ''}</td></tr>`).join('')
      : emptyRow(6, lista.length ? 'Nenhum fornecedor encontrado.' : 'Nenhum fornecedor cadastrado.', 'truck');
  };
  pintar();
  $('#fbusca', v).oninput = debounce(e => { busca = e.target.value; pintar(); }, 150);
  $('#fnovo', v).onclick = () => formPessoa('fornecedores');

      <div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Data</th><th>Produto</th><th class="num">Qtd</th><th class="num">Custo unit.</th><th class="num">Total</th><th>Nota / pedido</th></tr></thead><tbody>

const SIT = { pago: ['Pago', 'ok'], parcial: ['Parcial', 'info'], pendente: ['Pendente', 'warn'], vencido: ['Vencido', 'bad'] };
async function detalhesCliente(c) {
  const vendas = await q(sb.from('vendas').select('*').eq('cliente_id', c.id).order('data', { ascending: false }));
  const ids = vendas.map(x => x.id);
  const [itens, parcelas] = ids.length ? await Promise.all([
    q(sb.from('venda_itens').select('*').in('venda_id', ids)),
    q(sb.from('v_parcelas').select('*').in('venda_id', ids)),
  ]) : [[], []];
  const conf = vendas.filter(x => x.status === 'confirmada');
  const idsConf = new Set(conf.map(x => x.id));
  const total = conf.reduce((s, x) => s + Number(x.total), 0);
  const descontos = conf.reduce((s, x) => s + Number(x.desconto_total), 0);
  const aberto = parcelas.filter(p => idsConf.has(p.venda_id)).reduce((s, p) => s + Number(p.saldo), 0);
  const situacaoVenda = vid => {
    const ps = parcelas.filter(p => p.venda_id === vid);
    if (!ps.length) return '—';
    const k = ps.some(p => p.situacao === 'vencido') ? 'vencido' : ps.every(p => p.situacao === 'pago') ? 'pago' : ps.some(p => Number(p.valor_pago) > 0) ? 'parcial' : 'pendente';
    return `<span class="badge ${SIT[k][1]}">${SIT[k][0]}</span>`;
  };
  const agrupa = tipo => {
    const g = {};
    itens.filter(i => i.tipo === tipo && idsConf.has(i.venda_id)).forEach(i => {
      const k = i.descricao + '|' + i.especificacao;
      g[k] = g[k] || { nome: i.descricao, esp: i.especificacao, qtd: 0, total: 0 };
      g[k].qtd += Number(i.quantidade); g[k].total += Number(i.total);
    });
    return Object.values(g).sort((a, b) => b.total - a.total);
  };
  const tabelaItens = (l, vazio) => l.length ? `<div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Item</th><th class="num">Quantidade</th><th class="num">Total</th></tr></thead><tbody>
    ${l.map(x => `<tr><td class="first">${esc(x.nome)}${x.esp ? ` <span style="color:var(--muted)">— ${esc(x.esp)}</span>` : ''}</td><td data-l="Qtd" class="num">${qtdf(x.qtd)}</td><td data-l="Total" class="num">${brl(x.total)}</td></tr>`).join('')}</tbody></table></div></div>`
    : `<div style="color:var(--muted)">${vazio}</div>`;
  const m = openModal({
    title: c.nome, size: 'lg', dismiss: true,
    body: `<div class="sec-t">Dados cadastrais</div>
      <div class="contact" style="margin-bottom:8px">${linkTel(c.telefone)}${linkWa(c.telefone)}${linkMail(c.email)}</div>
      <div class="dl"><div><small>CPF / CNPJ</small><b>${esc(c.documento) || '—'}</b></div><div class="span2"><small>Endereço</small><b>${esc(c.endereco) || '—'}</b></div>
      ${c.observacao ? `<div><small>Observação</small><b style="font-weight:400">${esc(c.observacao)}</b></div>` : ''}</div>
      <div class="kpis" style="margin-top:18px">
        <div class="card kpi"><div class="ic ok">${ico('money')}</div><div><small>Total já comprado</small><b>${brl(total)}</b></div></div>
        <div class="card kpi"><div class="ic">${ico('cart')}</div><div><small>Compras</small><b>${conf.length}</b></div></div>
        <div class="card kpi"><div class="ic">${ico('check')}</div><div><small>Descontos concedidos</small><b>${brl(descontos)}</b></div></div>
        <div class="card kpi"><div class="ic warn">${ico('alert')}</div><div><small>A receber</small><b>${brl(aberto)}</b></div></div></div>
      <div class="sec-t">Histórico de compras</div>
      <div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Venda</th><th>Data</th><th class="num">Subtotal</th><th class="num">Desconto</th><th class="num">Total</th><th>Pagamento</th><th>Situação</th></tr></thead><tbody>
      ${vendas.length ? vendas.map(x => `<tr><td class="first"><b>Nº ${x.numero}</b> ${x.status === 'cancelada' ? '<span class="badge">Cancelada</span>' : ''}</td><td data-l="Data">${fmtDate(x.data)}</td>
        <td data-l="Subtotal" class="num">${brl(x.subtotal)}</td><td data-l="Desconto" class="num">${brl(x.desconto_total)}</td><td data-l="Total" class="num"><b>${brl(x.total)}</b></td>
        <td data-l="Forma">${esc(x.forma_pagamento) || '—'}${x.num_parcelas > 1 ? ` (${x.num_parcelas}x)` : ''}</td><td data-l="Situação">${x.status === 'cancelada' ? '—' : situacaoVenda(x.id)}</td></tr>`).join('')
        : emptyRow(7, 'Nenhuma venda registrada para este cliente.', 'cart')}</tbody></table></div></div>
      <div class="grid ${temProd() && temServ() ? 'g2' : ''}" style="margin-top:6px">${temProd() ? `<div><div class="sec-t">Produtos adquiridos</div>${tabelaItens(agrupa('produto'), 'Nenhum produto adquirido.')}</div>` : ''}
      ${temServ() ? `<div><div class="sec-t">Serviços contratados</div>${tabelaItens(agrupa('servico'), 'Nenhum serviço contratado.')}</div>` : ''}</div>`,
    foot: `<button class="btn" data-close>Fechar</button><button class="btn primary" id="dced">${ico('edit')} Editar</button>`,
  });
  $('#dced', m).onclick = () => { m.close(); formPessoa('clientes', c); };
}

/* =====================================================================
   DOCUMENTOS: PDF e EXCEL gerados no próprio navegador (sem bibliotecas)
   ===================================================================== */
const PdfKit = (() => {
  const cv = document.createElement('canvas').getContext('2d');
  const W1252 = { '€': 0x80, '‚': 0x82, 'ƒ': 0x83, '„': 0x84, '…': 0x85, '†': 0x86, '‡': 0x87, 'ˆ': 0x88, '‰': 0x89, 'Š': 0x8A, '‹': 0x8B, 'Œ': 0x8C, 'Ž': 0x8E, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '•': 0x95, '–': 0x96, '—': 0x97, '˜': 0x98, '™': 0x99, 'š': 0x9A, '›': 0x9B, 'œ': 0x9C, 'ž': 0x9E, 'Ÿ': 0x9F };
  const enc = s => { let o = ''; for (const ch of String(s ?? '')) { const c = ch.codePointAt(0);
    if (c === 0xA0 || c === 0x202F || c === 9 || c === 10 || c === 13) o += ' ';
    else if ((c >= 32 && c < 127) || (c > 0xA0 && c <= 0xFF)) o += String.fromCharCode(c);
    else if (W1252[ch]) o += String.fromCharCode(W1252[ch]); else o += '?'; } return o; };
  const escStr = s => s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const medir = (s, size, bold) => { cv.font = `${bold ? 'bold ' : ''}${size}px Helvetica, Arial, "Liberation Sans", sans-serif`; return cv.measureText(String(s ?? '')).width; };
  class Pdf {
    constructor(paisagem = false) { this.W = paisagem ? 842 : 595; this.H = paisagem ? 595 : 842; this.M = 36; this.pages = []; this.imgs = []; this.add(); }
    add() { this.cur = []; this.pages.push(this.cur); this.y = this.M; }
    get fim() { return this.H - this.M - 18; }
    ensure(h) { if (this.y + h > this.fim) { this.add(); return true; } return false; }
    cor(c) { return c.map(v => (v / 255).toFixed(3)).join(' '); }
    w(s, size = 10, bold = false) { return medir(s, size, bold); }
    text(s, x, y, { size = 10, bold = false, color = [29, 35, 43], align = 'left' } = {}) {
      const w = medir(s, size, bold); if (align === 'right') x -= w; else if (align === 'center') x -= w / 2;
      this.cur.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${this.cor(color)} rg ${x.toFixed(2)} ${(this.H - y - size * 0.8).toFixed(2)} Td (${escStr(enc(s))}) Tj ET`);
    }
    rect(x, y, w, h, { fill = null, stroke = null, lw = 0.6 } = {}) {
      this.cur.push(`q ${fill ? this.cor(fill) + ' rg ' : ''}${stroke ? this.cor(stroke) + ' RG ' : ''}${lw} w ${x.toFixed(2)} ${(this.H - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'} Q`);
    }
    line(x1, y1, x2, y2, { color = [210, 206, 198], lw = 0.6 } = {}) {
      this.cur.push(`q ${this.cor(color)} RG ${lw} w ${x1.toFixed(2)} ${(this.H - y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H - y2).toFixed(2)} l S Q`);
    }
    image(img, x, y, w, h) { let i = this.imgs.indexOf(img); if (i < 0) { this.imgs.push(img); i = this.imgs.length - 1; }
      this.cur.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(this.H - y - h).toFixed(2)} cm /Im${i} Do Q`); }
    wrap(s, maxW, size = 10, bold = false) {
      const linhas = []; String(s ?? '').split('\n').forEach(par => {
        let atual = ''; par.split(/\s+/).filter(Boolean).forEach(pal => {
          const t = atual ? atual + ' ' + pal : pal;
          if (medir(t, size, bold) <= maxW) atual = t;
          else { if (atual) linhas.push(atual); atual = pal;
            while (medir(atual, size, bold) > maxW && atual.length > 1) { let k = atual.length; while (k > 1 && medir(atual.slice(0, k), size, bold) > maxW) k--; linhas.push(atual.slice(0, k)); atual = atual.slice(k); } }
        }); linhas.push(atual);
      }); return linhas.length ? linhas : [''];
    }
    /* Tabela com quebra de página e cabeçalho repetido. cols: [{t, w (fração), align}] */
    table(cols, rows, { size = 8.5, cabecalho = true, zebra = true, negritoUltima = false } = {}) {
      const L = this.M, larg = this.W - 2 * this.M, pad = 4, lh = size * 1.25;
      const ws = cols.map(c => c.w * larg);
      const desenhaCab = () => {
        const linhasCab = cols.map((c, i) => this.wrap(c.t, ws[i] - 2 * pad, size, true));
        const h = Math.max(...linhasCab.map(l => l.length)) * lh + 2 * pad;
        this.rect(L, this.y, larg, h, { fill: [238, 241, 245] });
        let x = L; cols.forEach((c, i) => { linhasCab[i].forEach((ln, k) => this.text(ln, c.align === 'right' ? x + ws[i] - pad : x + pad, this.y + pad + k * lh, { size, bold: true, color: [70, 78, 90], align: c.align === 'right' ? 'right' : 'left' })); x += ws[i]; });
        this.y += h;
      };
      if (cabecalho) { this.ensure(40); desenhaCab(); }
      rows.forEach((r, ri) => {
        const ult = negritoUltima && ri === rows.length - 1;
        const cel = cols.map((c, i) => this.wrap(r[i], ws[i] - 2 * pad, size, ult));
        const h = Math.max(...cel.map(l => l.length)) * lh + 2 * pad;
        if (this.ensure(h) && cabecalho) desenhaCab();
        if (ult) this.rect(L, this.y, larg, h, { fill: [244, 243, 239] });
        else if (zebra && ri % 2 === 1) this.rect(L, this.y, larg, h, { fill: [250, 250, 248] });
        let x = L; cols.forEach((c, i) => { cel[i].forEach((ln, k) => this.text(ln, c.align === 'right' ? x + ws[i] - pad : x + pad, this.y + pad + k * lh, { size, bold: ult, align: c.align === 'right' ? 'right' : 'left' })); x += ws[i]; });
        this.y += h; this.line(L, this.y, L + larg, this.y, { color: [232, 229, 223], lw: 0.4 });
      });
    }
    save(rodape = '') {
      const n = this.pages.length;
      this.pages.forEach((pg, i) => { this.cur = pg;
        this.line(this.M, this.H - this.M + 2, this.W - this.M, this.H - this.M + 2, { color: [225, 222, 216], lw: 0.5 });
        if (rodape) this.text(rodape, this.M, this.H - this.M + 6, { size: 7.5, color: [130, 136, 145] });
        this.text(`Página ${i + 1} de ${n}`, this.W - this.M, this.H - this.M + 6, { size: 7.5, color: [130, 136, 145], align: 'right' }); });
      const objs = []; const add = s => { objs.push(s); return objs.length; };
      add('<< /Type /Catalog /Pages 2 0 R >>'); add('PAGES');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const imgIds = this.imgs.map(im => add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n${im.data}\nendstream`));
      const xo = imgIds.length ? `/XObject << ${imgIds.map((id, i) => `/Im${i} ${id} 0 R`).join(' ')} >>` : '';
      const kids = this.pages.map(pg => { const c = pg.join('\n'); const cid = add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
        return add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> ${xo} >> /Contents ${cid} 0 R >>`); });
      objs[1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
      let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const offs = [];
      objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
      out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      const b = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) b[i] = out.charCodeAt(i) & 255;
      return b;
    }
  }
  /* Converte qualquer imagem (URL) em JPEG para o PDF */
  async function imagemJpeg(url, max = 300) {
    if (!url) return null;
    try {
      const img = await new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = url; });
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      return { data: atob(c.toDataURL('image/jpeg', 0.9).split(',')[1]), w: c.width, h: c.height };
    } catch (e) { return null; }
  }
  return { Pdf, imagemJpeg };
})();

/* XLSX mínimo (zip sem compressão) */
const Xlsx = (() => {
  const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const te = new TextEncoder();
  function zip(arquivos) {
    const partes = [], central = []; let off = 0;
    const u16 = v => [v & 255, (v >>> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
    arquivos.forEach(({ nome, dados }) => {
      const n = te.encode(nome), d = typeof dados === 'string' ? te.encode(dados) : dados, crc = crc32(d);
      const loc = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(d.length), ...u32(d.length), ...u16(n.length), ...u16(0)]);
      partes.push(loc, n, d);
      central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(d.length), ...u32(d.length), ...u16(n.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), n);
      off += loc.length + n.length + d.length;
    });
    const tamC = central.reduce((s, p) => s + p.length, 0);
    const fim = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(arquivos.length), ...u16(arquivos.length), ...u32(tamC), ...u32(off), ...u16(0)]);
    return new Blob([...partes, ...central, fim], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  const colL = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  /* planilha: {nome, titulo, filtros, colunas:[{t, tipo}], linhas:[[valores brutos]], total:[...]} */
  function gerar(planilhas) {
    const ESTILO = { txt: 0, brl: 2, num: 5, qtd: 5, pct: 3, data: 0, int: 6 };
    const sheets = planilhas.map(pl => {
      const rows = []; let r = 1;
      const cel = (c, v, tipo, st) => {
        const ref = colL(c) + r;
        if (tipo === 'data' && /^\d{4}-\d{2}-\d{2}$/.test(String(v))) { const [a, m, d] = String(v).split('-').map(Number); return `<c r="${ref}" s="10"><v>${(Date.UTC(a, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5}</v></c>`; }
        if (typeof v === 'number' && isFinite(v) && tipo !== 'txt') return `<c r="${ref}" s="${st ?? ESTILO[tipo] ?? 5}"><v>${tipo === 'pct' ? v / 100 : v}</v></c>`;
        if (v === null || v === undefined || v === '') return '';
        return `<c r="${ref}" t="inlineStr" s="${st ?? 0}"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
      };
      if (pl.titulo) { rows.push(`<row r="${r}">${cel(0, pl.titulo, 'txt', 7)}</row>`); r++; }
      if (pl.filtros) { rows.push(`<row r="${r}">${cel(0, pl.filtros, 'txt')}</row>`); r++; }
      if (pl.titulo || pl.filtros) r++;
      const lCab = r;
      rows.push(`<row r="${r}">${pl.colunas.map((c, i) => cel(i, c.t, 'txt', 1)).join('')}</row>`); r++;
      pl.linhas.forEach(l => { rows.push(`<row r="${r}">${l.map((v, i) => cel(i, v, pl.colunas[i].tipo || 'txt')).join('')}</row>`); r++; });
      if (pl.total) { rows.push(`<row r="${r}">${pl.total.map((v, i) => cel(i, v, pl.colunas[i].tipo || 'txt', typeof v === 'number' ? ({ brl: 4, pct: 8, int: 9 }[pl.colunas[i].tipo] ?? 9) : 1)).join('')}</row>`); r++; }
      const largs = pl.colunas.map((c, i) => Math.min(60, Math.max(10, String(c.t).length + 2, ...pl.linhas.slice(0, 300).map(l => String(typeof l[i] === 'number' ? brl(l[i]) : l[i] ?? '').length + 2))));
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="${lCab}" topLeftCell="A${lCab + 1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${largs.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.join('')}</sheetData></worksheet>`;
    });
    const nomes = planilhas.map((p, i) => (p.nome || 'Planilha ' + (i + 1)).replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31));
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="3"><numFmt numFmtId="164" formatCode="&quot;R$&quot; #,##0.00"/><numFmt numFmtId="165" formatCode="0.00%"/><numFmt numFmtId="166" formatCode="#,##0.###"/></numFmts>
<fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEEF1F5"/></patternFill></fill></fills>
<borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs>
<cellXfs count="11"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf numFmtId="164" applyNumberFormat="1"/><xf numFmtId="165" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="2" applyNumberFormat="1" applyFont="1" applyFill="1"/><xf numFmtId="166" applyNumberFormat="1"/><xf numFmtId="1" applyNumberFormat="1"/><xf fontId="2" applyFont="1"/><xf numFmtId="165" fontId="1" fillId="2" applyNumberFormat="1" applyFont="1" applyFill="1"/><xf numFmtId="166" fontId="1" fillId="2" applyNumberFormat="1" applyFont="1" applyFill="1"/><xf numFmtId="14" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const arquivos = [
      { nome: '[Content_Types].xml', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
      { nome: '_rels/.rels', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { nome: 'xl/workbook.xml', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${nomes.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
      { nome: 'xl/_rels/workbook.xml.rels', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { nome: 'xl/styles.xml', dados: styles },
      ...sheets.map((s, i) => ({ nome: `xl/worksheets/sheet${i + 1}.xml`, dados: s })),
    ];
    return zip(arquivos);
  }
  return { gerar };
})();

function baixar(blob, nome) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const nomeArq = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* Cabeçalho com dados da empresa (recibos, orçamentos e relatórios) */
async function cabecalhoPdf(pdf, titulo, direita = []) {
  const e = S.empresa || {}, M = pdf.M;
  const logo = await PdfKit.imagemJpeg(e.logo_url, 260);
  let x = M;
  if (logo) { const h = 48, w = Math.min(110, logo.w * h / logo.h); pdf.image(logo, M, pdf.y, w, h); x = M + w + 12; }
  const nome = e.nome_fantasia || e.razao_social || 'Minha empresa';
  pdf.text(nome, x, pdf.y, { size: 14, bold: true });
  const info = [e.razao_social && e.razao_social !== nome ? e.razao_social : '', e.documento ? (onlyDigits(e.documento).length > 11 ? 'CNPJ ' : 'CPF ') + e.documento : '',
    [e.telefone, e.email].filter(Boolean).join(' · '), e.endereco].filter(Boolean);
  info.forEach((l, i) => pdf.text(l, x, pdf.y + 19 + i * 11, { size: 8.5, color: [95, 102, 112] }));
  const R = pdf.W - M;
  pdf.text(titulo, R, pdf.y, { size: 15, bold: true, align: 'right' });
  direita.forEach((l, i) => pdf.text(l, R, pdf.y + 20 + i * 12, { size: 9, color: [70, 78, 90], align: 'right' }));
  pdf.y += Math.max(logo ? 52 : 0, 22 + info.length * 11, 22 + direita.length * 12) + 8;
  pdf.line(M, pdf.y, pdf.W - M, pdf.y, { color: corPdf(), lw: 1.2 });
  pdf.y += 14;
}
function blocoPdf(pdf, titulo, linhas) {
  const M = pdf.M, larg = pdf.W - 2 * M;
  const ls = linhas.filter(Boolean).flatMap(l => pdf.wrap(l, larg - 20, 9));
  const h = 22 + ls.length * 12 + 6;
  pdf.ensure(h);
  pdf.rect(M, pdf.y, larg, h, { fill: [250, 250, 248], stroke: [229, 227, 221] });
  pdf.text(titulo.toUpperCase(), M + 10, pdf.y + 8, { size: 7.5, bold: true, color: [130, 136, 145] });
  ls.forEach((l, i) => pdf.text(l, M + 10, pdf.y + 22 + i * 12, { size: 9, bold: i === 0 }));
  pdf.y += h + 12;
}
function totaisPdf(pdf, linhas) {
  const R = pdf.W - pdf.M, w = 220;
  pdf.ensure(linhas.length * 16 + 20); pdf.y += 6;
  linhas.forEach(([k, v, forte]) => {
    if (forte) { const tc = textoSobreCorPdf(); pdf.rect(R - w, pdf.y - 3, w, 20, { fill: corPdf() }); pdf.text(k, R - w + 10, pdf.y + 2, { size: 10.5, bold: true, color: tc }); pdf.text(v, R - 10, pdf.y + 2, { size: 10.5, bold: true, color: tc, align: 'right' }); pdf.y += 22; }
    else { pdf.text(k, R - w + 10, pdf.y, { size: 9.5, color: [95, 102, 112] }); pdf.text(v, R - 10, pdf.y, { size: 9.5, align: 'right' }); pdf.y += 15; }
  });
  pdf.y += 8;
}
const descontoTxt = d => d.desconto_total > 0 ? (d.desconto_tipo === 'percentual' ? `Desconto (${nf(d.desconto_valor)}%)` : 'Desconto') : 'Desconto';

async function pdfVenda(id) {
  const [v, itens, parcelas] = await Promise.all([
    q(sb.from('vendas').select('*').eq('id', id).single()),
    q(sb.from('venda_itens').select('*').eq('venda_id', id)),
    q(sb.from('v_parcelas').select('*').eq('venda_id', id).order('numero')),
  ]);
  const cli = v.cliente_id ? (await q(sb.from('clientes').select('*').eq('id', v.cliente_id))).at(0) : null;
  const pdf = new PdfKit.Pdf();
  await cabecalhoPdf(pdf, 'RECIBO', [`Venda nº ${v.numero}`, `Data: ${fmtDate(v.data)}`, v.status === 'cancelada' ? 'VENDA CANCELADA' : '']);
  blocoPdf(pdf, 'Cliente', cli ? [cli.nome, cli.documento && 'CPF/CNPJ: ' + cli.documento, [cli.telefone, cli.email].filter(Boolean).join(' · '), cli.endereco] : [v.cliente_nome || 'Consumidor não identificado']);
  pdf.table([{ t: 'Tipo', w: .1 }, { t: 'Produto / serviço', w: .44 }, { t: 'Qtd', w: .1, align: 'right' }, { t: 'Valor unitário', w: .18, align: 'right' }, { t: 'Total', w: .18, align: 'right' }],
    itens.sort((a, b) => a.tipo.localeCompare(b.tipo)).map(i => [i.tipo === 'produto' ? 'Produto' : 'Serviço', i.descricao + (i.especificacao ? ' — ' + i.especificacao : ''), qtdf(i.quantidade), brl(i.preco_unitario), brl(i.total)]), { size: 9 });
  totaisPdf(pdf, [['Subtotal', brl(v.subtotal)], [descontoTxt(v), '- ' + brl(v.desconto_total)], ['Valor total', brl(v.total), true]]);
  const pago = parcelas.reduce((s, p) => s + Number(p.valor_pago), 0);
  blocoPdf(pdf, 'Pagamento', [`Forma de pagamento: ${v.forma_pagamento || '—'}`, v.num_parcelas > 1 ? `Parcelado em ${v.num_parcelas}x` : 'À vista',
    ...(v.num_parcelas > 1 ? parcelas.map(p => `Parcela ${p.numero}: ${brl(p.valor)} — vencimento ${fmtDate(p.vencimento)}${Number(p.valor_pago) >= Number(p.valor) ? ' (paga)' : ''}`) : []),
    `Valor recebido até a emissão: ${brl(pago)}`]);
  if (v.observacao) blocoPdf(pdf, 'Observação', [v.observacao]);
  pdf.ensure(70); pdf.y += 34;
  const cx = pdf.W / 2; pdf.line(cx - 130, pdf.y, cx + 130, pdf.y, { color: [120, 126, 135] });
  pdf.text(S.empresa.nome_fantasia || S.empresa.razao_social || 'Assinatura', cx, pdf.y + 5, { size: 8.5, color: [95, 102, 112], align: 'center' });
  return { bytes: pdf.save(`Recibo da venda nº ${v.numero} · emitido em ${new Date().toLocaleString('pt-BR')}`), venda: v, cliente: cli, nome: `recibo-venda-${v.numero}.pdf` };
}

async function pdfOrcamento(id) {
  const [o, itens] = await Promise.all([q(sb.from('orcamentos').select('*').eq('id', id).single()), q(sb.from('orcamento_itens').select('*').eq('orcamento_id', id))]);
  const cli = o.cliente_id ? (await q(sb.from('clientes').select('*').eq('id', o.cliente_id))).at(0) : null;
  const pdf = new PdfKit.Pdf();
  await cabecalhoPdf(pdf, 'ORÇAMENTO', [`Nº ${o.numero}`, `Data: ${fmtDate(o.data)}`, o.validade ? `Válido até: ${fmtDate(o.validade)}` : '']);
  blocoPdf(pdf, 'Cliente', cli ? [cli.nome, cli.documento && 'CPF/CNPJ: ' + cli.documento, [cli.telefone, cli.email].filter(Boolean).join(' · '), cli.endereco] : [o.cliente_nome || 'Cliente não informado']);
  pdf.table([{ t: 'Tipo', w: .1 }, { t: 'Produto / serviço', w: .44 }, { t: 'Qtd', w: .1, align: 'right' }, { t: 'Valor unitário', w: .18, align: 'right' }, { t: 'Total', w: .18, align: 'right' }],
    itens.sort((a, b) => a.tipo.localeCompare(b.tipo)).map(i => [i.tipo === 'produto' ? 'Produto' : 'Serviço', i.descricao + (i.especificacao ? ' — ' + i.especificacao : ''), qtdf(i.quantidade), brl(i.preco_unitario), brl(i.total)]), { size: 9 });
  totaisPdf(pdf, [['Subtotal', brl(o.subtotal)], [descontoTxt(o), '- ' + brl(o.desconto_total)], ['Valor total', brl(o.total), true]]);
  if (o.observacao) blocoPdf(pdf, 'Observação', [o.observacao]);
  blocoPdf(pdf, 'Condições', [o.validade ? `Este orçamento é válido até ${fmtDate(o.validade)}.` : 'Orçamento sujeito a confirmação.', 'Valores sujeitos à disponibilidade de estoque na data da confirmação.']);
  return { bytes: pdf.save(`Orçamento nº ${o.numero} · emitido em ${new Date().toLocaleString('pt-BR')}`), orc: o, cliente: cli, nome: `orcamento-${o.numero}.pdf` };
}

/* Guarda uma cópia do PDF no Storage (somente conectado ao Supabase) */
async function arquivarPdf(bytes, pasta, nome) {
  if (MODO_DEMO) return null;
  try { const path = `${S.empresa.id}/${pasta}/${nome}`; await q(sb.storage.from('documentos').upload(path, new Blob([bytes], { type: 'application/pdf' }), { contentType: 'application/pdf', upsert: true })); return path; }
  catch (e) { console.warn('Cópia do PDF não arquivada:', e); return null; }
}

/* Envio por e-mail: função "enviar-documento" no Supabase (Resend). Sem ela: baixar + abrir e-mail */
function b64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
async function enviarPorEmail({ tipo, id, numero, cliente, doc }) {
  const rotulo = tipo === 'venda' ? `Recibo da venda nº ${numero}` : `Orçamento nº ${numero}`;
  if (!cliente?.email) return toast('O cliente não tem e-mail cadastrado. Inclua o e-mail na tela de Clientes.', 'bad');
  let motivo = MODO_DEMO ? 'No modo de visualização o envio automático não está disponível.' : 'O envio automático ainda não está configurado no Supabase (função "enviar-documento").';
  if (!MODO_DEMO && sb.functions?.invoke) {
    try {
      const { data, error } = await sb.functions.invoke('enviar-documento', { body: { tipo, id, nome_arquivo: doc.nome, pdf_base64: b64(doc.bytes) } });
      if (error || data?.erro) throw new Error(data?.erro || error.message);
      toast(`${rotulo} enviado para ${cliente.email}.`, 'ok'); return true;
    } catch (e) { motivo = 'O envio automático ainda não está configurado no Supabase (função "enviar-documento").'; console.warn(e); }
  }
  const nomeEmp = S.empresa.nome_fantasia || S.empresa.razao_social || '';
  const m = openModal({ title: 'Enviar por e-mail', size: 'sm', body: `<p style="margin-top:0">${esc(motivo)}</p>
    <p>Você pode baixar o PDF e abrir seu e-mail já endereçado a <b>${esc(cliente.email)}</b> — basta anexar o arquivo.</p>`,
    foot: `<button class="btn" id="emb">${ico('arrowin')} Baixar PDF</button><a class="btn primary" id="ema" href="mailto:${encodeURIComponent(cliente.email)}?subject=${encodeURIComponent(rotulo + (nomeEmp ? ' — ' + nomeEmp : ''))}&body=${encodeURIComponent(`Olá, ${cliente.nome}!\n\nSegue em anexo o ${rotulo.toLowerCase()}.\n\n${nomeEmp}`)}">${ico('mail')} Abrir e-mail</a>` });
  $('#emb', m).onclick = () => baixar(new Blob([doc.bytes], { type: 'application/pdf' }), doc.nome);
  $('#ema', m).addEventListener('click', () => baixar(new Blob([doc.bytes], { type: 'application/pdf' }), doc.nome));
  return false;
}

    const dv = st.comDesconto ? parseNum($('#eddval', el).value) : 0;
    const desc = Math.min(sub, round2(st.desconto_tipo === 'percentual' ? sub * Math.min(dv, 100) / 100 : dv));
    return { sub, desc, total: round2(sub - desc), dv };
  };
  const pintar = () => {
    const usado = {};
    st.itens.filter(i => i.tipo === 'produto').forEach(i => usado[i.id] = (usado[i.id] || 0) + i.qtd);
    $('#edtb', el).innerHTML = st.itens.length ? st.itens.map((i, k) => {
      const falta = modo === 'venda' && i.tipo === 'produto' && usado[i.id] > i.estoque;
      return `<tr data-k="${k}"><td class="first"><span class="badge ${i.tipo === 'produto' ? 'info' : 'ok'}" style="margin-right:6px">${i.tipo === 'produto' ? 'Produto' : 'Serviço'}</span><b>${esc(i.nome)}</b>${i.esp ? ` <span style="color:var(--muted)">— ${esc(i.esp)}</span>` : ''}
        ${falta ? `<div><span class="badge bad">Estoque disponível: ${qtdf(i.estoque)}</span></div>` : ''}</td>
        <td data-l="Quantidade" class="num"><input class="f qtd" data-money data-dec="q" inputmode="decimal" value="${qtdf(i.qtd)}"></td>
        <td data-l="Valor unitário" class="num">${brl(i.preco)}</td><td data-l="Total" class="num"><b>${brl(round2(i.preco * i.qtd))}</b></td>
        <td class="act"><button class="icon-btn bad" data-rm title="Remover">${ico('trash')}</button></td></tr>`; }).join('')
      : `<tr><td colspan="5"><div class="empty" style="padding:24px">${ico('cart')}<div>Nenhum item adicionado.</div></div></td></tr>`;
    bindMoney($('#edtb', el));
    $$('#eddtipo button', el).forEach(b => b.classList.toggle('on', b.dataset.t === st.desconto_tipo));
    const c = calc();
    $('#edsub', el).textContent = brl(c.sub);
    $('#eddtot', el).textContent = (c.desc ? '- ' : '') + brl(c.desc) + (st.comDesconto && st.desconto_tipo === 'percentual' && c.dv ? ` (${nf(c.dv)}%)` : '');
    $('#edtot', el).textContent = brl(c.total);
    const falta = modo === 'venda' && Object.entries(usado).some(([id, q]) => q > (produtos.find(p => p.id === id)?.quantidade ?? 0));
    $('#edaviso', el).innerHTML = falta ? `<div class="alert bad" style="margin:12px 0 0">${ico('alert')} Há produto com quantidade maior que o estoque disponível.</div>` : '';
    el.dispatchEvent(new CustomEvent('mudou', { detail: c }));
  };
  const adicionar = () => {
    const txt = $('#edbusca', el).value.trim();
    let x = mapa[txt];
    if (!x && txt) { const fonte = st.tipo === 'produto' ? produtos : servicos; const ach = fonte.filter(f => norm(f.nome + ' ' + f.especificacao).includes(norm(txt))); if (ach.length === 1) x = ach[0]; }
    if (!x) return toast(txt ? 'Item não encontrado. Escolha uma opção da lista.' : 'Digite e escolha um item da lista.', 'bad');
    const qn = parseNum($('#edqtd', el).value);
    if (!(qn > 0)) return toast('Informe uma quantidade maior que zero.', 'bad');
    const ex = st.itens.find(i => i.tipo === st.tipo && i.id === x.id);
    if (ex) ex.qtd = r3(ex.qtd + qn);
    else st.itens.push({ tipo: st.tipo, id: x.id, nome: x.nome, esp: x.especificacao, preco: Number(st.tipo === 'produto' ? x.preco_venda : x.preco), qtd: qn, estoque: Number(x.quantidade ?? Infinity) });
    $('#edbusca', el).value = ''; $('#edqtd', el).value = '1'; $('#edbusca', el).focus();
    pintar();
  };
  pintarClientes(); pintarLista(); pintar();
  $('#edcli', el).onchange = e => st.cliente_id = e.target.value;
  $('#ednovo', el).onclick = () => formPessoa('clientes', null, novo => { clientes.push(novo); clientes.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); st.cliente_id = novo.id; pintarClientes(); });
  $$('#edtipo button', el).forEach(b => b.onclick = () => { st.tipo = b.dataset.t; $('#edbusca', el).value = ''; pintarLista(); });
  $('#edadd', el).onclick = adicionar;
  $('#edbusca', el).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adicionar(); } });
  $('#edbusca', el).addEventListener('change', () => { if (mapa[$('#edbusca', el).value]) $('#edqtd', el).focus(); });
  $('#edqtd', el).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adicionar(); } });
  $('#edtb', el).addEventListener('change', e => { const tr = e.target.closest('tr[data-k]'); if (!tr || !e.target.classList.contains('qtd')) return;
    const v = parseNum(e.target.value); if (v > 0) st.itens[tr.dataset.k].qtd = v; pintar(); });
  $('#edtb', el).addEventListener('click', e => { const tr = e.target.closest('tr[data-k]'); if (tr && e.target.closest('[data-rm]')) { st.itens.splice(+tr.dataset.k, 1); pintar(); } });
  $('#eddescbtn', el).onclick = () => { st.comDesconto = true; $('#eddesc', el).classList.remove('hidden'); $('#eddescbtn', el).classList.add('hidden'); $('#eddval', el).focus(); pintar(); };
  $('#eddrm', el).onclick = () => { st.comDesconto = false; $('#eddval', el).value = ''; $('#eddesc', el).classList.add('hidden'); $('#eddescbtn', el).classList.remove('hidden'); pintar(); };
  $$('#eddtipo button', el).forEach(b => b.onclick = () => { st.desconto_tipo = b.dataset.t; pintar(); });
  $('#eddval', el).addEventListener('input', pintar);
  return {
    st, calc, pintar,
    payload: () => { const c = calc(); return { cliente_id: st.cliente_id || null, itens: st.itens.map(i => ({ tipo: i.tipo, id: i.id, quantidade: i.qtd })), desconto_tipo: st.desconto_tipo, desconto_valor: st.comDesconto ? round2(c.dv) : 0 }; },
    validar: () => {
      if (!st.itens.length) { toast('Adicione ao menos um produto ou serviço.', 'bad'); return false; }
      const c = calc();
      if (st.comDesconto && st.desconto_tipo === 'percentual' && c.dv > 100) { toast('O desconto não pode passar de 100%.', 'bad'); return false; }
      if (st.comDesconto && c.dv > c.sub && st.desconto_tipo === 'valor') { toast('O desconto não pode ser maior que o subtotal.', 'bad'); return false; }
      return true;
    },
  };
}
const r3 = v => Math.round(Number(v) * 1000) / 1000;

/* Bloco de pagamento (venda direta e conversão de orçamento) */
function blocoPagamento() {
  return `<div class="card"><div class="card-h"><h3>Pagamento</h3></div><div class="card-b">
    <div class="grid g3">
      <div class="field"><label>Forma de pagamento *</label><select class="f" name="forma">${FORMAS.map(f => `<option>${f}</option>`).join('')}</select></div>
      <div class="field"><label>Condição</label><div class="seg" data-cond><button type="button" class="on" data-c="avista">À vista</button><button type="button" data-c="parcelado">Parcelado</button></div></div>
      <div class="field" data-parc><label>Nº de parcelas</label><select class="f" name="nparc">${Array.from({ length: 23 }, (_, i) => `<option>${i + 2}</option>`).join('')}</select></div>
      <div class="field"><label data-lvenc>Vencimento</label><input class="f" type="date" name="venc" value="${new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}"></div>
      <div class="field span2" style="justify-content:flex-end"><label class="chk"><input type="checkbox" name="pago" checked> <span data-lpago>Pagamento recebido no ato</span></label></div>
      <div class="field spanall"><label>Observação</label><input class="f" name="obs" maxlength="300"></div>
    </div>
    <div data-prev style="margin-top:12px"></div>
  </div></div>`;
}
function ligarPagamento(el, totalFn) {
  const st = { cond: 'avista' };
  const g = n => $(`[name=${n}]`, el);
  const addM = (d, n) => { const [y, m, dd] = d.split('-').map(Number); const x = new Date(Date.UTC(y, m - 1 + n, 1)); const u = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate(); x.setUTCDate(Math.min(dd, u)); return x.toISOString().slice(0, 10); };
  const pintar = () => {
    $$('[data-cond] button', el).forEach(b => b.classList.toggle('on', b.dataset.c === st.cond));
    $('[data-parc]', el).classList.toggle('hidden', st.cond === 'avista');
    $('[data-lvenc]', el).textContent = st.cond === 'avista' ? 'Vencimento' : 'Vencimento da 1ª parcela';
    $('[data-lpago]', el).textContent = st.cond === 'avista' ? 'Pagamento recebido no ato' : '1ª parcela recebida no ato';
    const tot = totalFn(), n = st.cond === 'avista' ? 1 : +g('nparc').value, venc = g('venc').value;
    if (n > 1 && venc) {
      const p = round2(tot / n); let ac = 0;
      $('[data-prev]', el).innerHTML = `<div class="parc-prev">${Array.from({ length: n }, (_, i) => { const v = i === n - 1 ? round2(tot - ac) : p; ac = round2(ac + p); return `<span><small>${i + 1}ª · ${fmtDate(addM(venc, i))}</small><b>${brl(v)}</b></span>`; }).join('')}</div>`;
    } else $('[data-prev]', el).innerHTML = '';
  };
  $$('[data-cond] button', el).forEach(b => b.onclick = () => { st.cond = b.dataset.c; pintar(); });
  g('nparc').onchange = pintar; g('venc').onchange = pintar;
  pintar();
  return {
    pintar,
    dados: () => ({ forma_pagamento: g('forma').value, num_parcelas: st.cond === 'avista' ? 1 : +g('nparc').value, primeiro_vencimento: g('venc').value || null, pago_agora: g('pago').checked, observacao: g('obs').value.trim() }),
  };
}

/* Depois de concluir a venda: recibo em PDF + pergunta sobre e-mail */
async function posVenda(vendaId, depois = () => { location.hash = '#/vendas'; }) {
  let doc = null, erro = '';
  try { doc = await pdfVenda(vendaId); const path = await arquivarPdf(doc.bytes, 'recibos', doc.nome); if (path) await sb.from('vendas').update({ recibo_url: path }).eq('id', vendaId); }
  catch (e) { erro = traduzErro(e); console.error(e); }
  const v = doc?.venda || await q(sb.from('vendas').select('*').eq('id', vendaId).single());
  const cli = doc?.cliente;
  const m = openModal({ title: `Venda nº ${v.numero} concluída`, size: 'sm',
    body: `<div style="text-align:center"><div class="okmark">${ico('check')}</div>
      <div style="font-size:22px;font-weight:700;margin:6px 0 2px">${brl(v.total)}</div>
      <div style="color:var(--muted)">${esc(v.cliente_nome || 'Sem cliente')} · ${esc(v.forma_pagamento)}${v.num_parcelas > 1 ? ` · ${v.num_parcelas}x` : ''}</div>
      ${doc ? `<button class="btn" id="pvpdf" style="margin-top:14px">${ico('file')} Baixar recibo (PDF)</button>` : `<div class="alert bad" style="margin-top:12px">Não foi possível gerar o recibo: ${esc(erro)}</div>`}
      <hr style="border:0;border-top:1px solid var(--line-2);margin:18px 0">
      ${cli?.email ? `<p style="margin:0 0 4px"><b>Deseja enviar o recibo para o e-mail cadastrado do cliente?</b></p><p style="margin:0;color:var(--muted);font-size:13px">${esc(cli.email)}</p>`
        : `<p style="margin:0;color:var(--muted)">${cli ? 'O cliente não tem e-mail cadastrado, então o recibo não pode ser enviado por e-mail.' : 'Venda sem cliente cadastrado — envio por e-mail indisponível.'}</p>`}
    </div>`,
    foot: cli?.email && doc ? `<button class="btn" id="pvnao">NÃO</button><button class="btn primary" id="pvsim">${ico('mail')} SIM</button>` : `<button class="btn primary" id="pvnao">Concluir</button>` });
  const fechar = () => { m.close(); depois(); };
  if ($('#pvpdf', m)) $('#pvpdf', m).onclick = () => baixar(new Blob([doc.bytes], { type: 'application/pdf' }), doc.nome);
  $('#pvnao', m).onclick = fechar;
  $('[data-close]', m).addEventListener('click', () => depois());
  if ($('#pvsim', m)) $('#pvsim', m).onclick = () => busy($('#pvsim', m), async () => {
    const ok = await enviarPorEmail({ tipo: 'venda', id: v.id, numero: v.numero, cliente: cli, doc });
    if (ok) fechar(); else { m.close(); depois(); }
  });
}

/* =====================================================================
   VENDAS
   ===================================================================== */
function sitVenda(ps) {
  if (!ps || !ps.length) return null;
  return ps.some(p => p.situacao === 'vencido') ? 'vencido' : ps.every(p => p.situacao === 'pago') ? 'pago' : ps.some(p => Number(p.valor_pago) > 0) ? 'parcial' : 'pendente';
}
const badgeSit = k => k ? `<span class="badge ${SIT[k][1]}">${SIT[k][0]}</span>` : '—';
const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const mesDe = d => { const x = new Date(String(d).length === 10 ? d + 'T12:00:00' : d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`; };
const diaDe = d => { const x = new Date(String(d).length === 10 ? d + 'T12:00:00' : d); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const rotMes = ym => { const [y, m] = ym.split('-'); return `${MESES[+m - 1]}/${y.slice(2)}`; };

Views.vendas = async (v, args, vivo) => {
  if (args[0] === 'nova') return telaNovaVenda(v, vivo);
  const [vendas, parcelas] = await Promise.all([q(sb.from('vendas').select('*').order('data', { ascending: false })), q(sb.from('v_parcelas').select('*'))]);
  if (!vivo()) return;
  const pv = {}; parcelas.forEach(p => (pv[p.venda_id] = pv[p.venda_id] || []).push(p));
  const st = { busca: '', mes: '', status: 'confirmada', sit: '' };
  const meses = [...new Set(vendas.map(x => mesDe(x.data)))].sort().reverse();
  v.innerHTML = `<div class="page-h"><div><h1>Vendas</h1><p>Registro de vendas de produtos e serviços.</p></div>
      <div class="actions"><a class="btn primary" href="#/vendas/nova">${ico('plus')} Nova venda</a></div></div>
    <div class="kpis" id="vk"></div>
    <div class="toolbar">
      <div class="search">${ico('search')}<input class="f" id="vbusca" placeholder="Pesquisar por nº ou cliente…"></div>
      <select class="f" id="vmes"><option value="">Todos os meses</option>${meses.map(m => `<option value="${m}">${rotMes(m)}</option>`).join('')}</select>
      <select class="f" id="vstatus"><option value="confirmada">Confirmadas</option><option value="cancelada">Canceladas</option><option value="">Todas</option></select>
      <select class="f" id="vsit"><option value="">Qualquer pagamento</option>${Object.entries(SIT).map(([k, x]) => `<option value="${k}">${x[0]}</option>`).join('')}</select>
    </div>
    <div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th class="num">Total</th><th>Forma</th><th>Pagamento</th><th>Status</th></tr></thead><tbody id="vtb"></tbody></table></div></div>`;
  const pintar = () => {
    const b = norm(st.busca);
    const l = vendas.filter(x => (!b || norm(x.cliente_nome).includes(b) || String(x.numero) === b.replace(/\D/g, ''))
      && (!st.mes || mesDe(x.data) === st.mes) && (!st.status || x.status === st.status)
      && (!st.sit || (x.status === 'confirmada' && sitVenda(pv[x.id]) === st.sit)));
    const conf = l.filter(x => x.status === 'confirmada');
    const tot = conf.reduce((s, x) => s + Number(x.total), 0);
    const rec = conf.reduce((s, x) => s + (pv[x.id] || []).reduce((a, p) => a + Number(p.valor_pago), 0), 0);
    $('#vk', v).innerHTML = `
      <div class="card kpi"><div class="ic">${ico('cart')}</div><div><small>Vendas</small><b>${conf.length}</b></div></div>
      <div class="card kpi"><div class="ic ok">${ico('money')}</div><div><small>Total vendido</small><b>${brl(tot)}</b></div></div>
      <div class="card kpi"><div class="ic">${ico('check')}</div><div><small>Recebido</small><b>${brl(rec)}</b></div></div>
      <div class="card kpi"><div class="ic warn">${ico('alert')}</div><div><small>A receber</small><b>${brl(tot - rec)}</b></div></div>`;
    $('#vtb', v).innerHTML = l.length ? l.map(x => `<tr class="click" data-id="${x.id}"><td class="first"><b>Nº ${x.numero}</b></td><td data-l="Data">${fmtDateTime(x.data)}</td>
      <td data-l="Cliente">${esc(x.cliente_nome) || '—'}</td><td data-l="Total" class="num"><b>${brl(x.total)}</b></td>
      <td data-l="Forma">${esc(x.forma_pagamento)}${x.num_parcelas > 1 ? ` (${x.num_parcelas}x)` : ''}</td>
      <td data-l="Pagamento">${x.status === 'cancelada' ? '—' : badgeSit(sitVenda(pv[x.id]))}</td>
      <td data-l="Status">${x.status === 'cancelada' ? '<span class="badge bad">Cancelada</span>' : '<span class="badge ok">Confirmada</span>'}</td></tr>`).join('')
      : emptyRow(7, vendas.length ? 'Nenhuma venda com esses filtros.' : 'Nenhuma venda registrada. Clique em "Nova venda".', 'cart');
  };
  pintar();
  $('#vbusca', v).oninput = debounce(e => { st.busca = e.target.value; pintar(); }, 150);
  $('#vmes', v).onchange = e => { st.mes = e.target.value; pintar(); };
  $('#vstatus', v).onchange = e => { st.status = e.target.value; pintar(); };
  $('#vsit', v).onchange = e => { st.sit = e.target.value; pintar(); };
  $('#vtb', v).onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) detalhesVenda(tr.dataset.id).catch(falha); };
};

async function telaNovaVenda(v, vivo) {
  const [produtos, servicos, clientes] = await Promise.all([Dados.produtos(), Dados.servicos(), Dados.clientes()]);
  if (!vivo()) return;
  v.innerHTML = `<div class="page-h"><div><h1>Nova venda</h1><p>Selecione o cliente, os itens e a forma de pagamento.</p></div>
    <div class="actions"><a class="btn" href="#/vendas">Voltar</a></div></div><div id="nved"></div>`;
  const el = $('#nved', v);
  const ed = montarEditor(el, { produtos, servicos, clientes, modo: 'venda', extra: blocoPagamento(),
    acoes: `<button class="btn primary big" id="nvconf" type="button">${ico('check')} CONFIRMAR VENDA</button>` });
  const pag = ligarPagamento(el, () => ed.calc().total);
  el.addEventListener('mudou', () => pag.pintar());
  $('#nvconf', el).onclick = async () => {
    if (!ed.validar()) return;
    if ($('#edaviso .alert', el)) return toast('Ajuste as quantidades: há produto sem estoque suficiente.', 'bad');
    const c = ed.calc(), d = pag.dados();
    if (!ed.st.cliente_id && !await confirmar('Nenhum cliente selecionado. Registrar a venda sem cliente?', { ok: 'Registrar sem cliente' })) return;
    const nomeCli = clientes.find(x => x.id === ed.st.cliente_id)?.nome;
    if (!await confirmar(`<div class="rs"><span>Cliente</span><b>${esc(nomeCli || 'Sem cliente')}</b></div>
      <div class="rs"><span>Itens</span><b>${ed.st.itens.length}</b></div>
      <div class="rs"><span>Subtotal</span><b>${brl(c.sub)}</b></div><div class="rs"><span>Desconto</span><b>${brl(c.desc)}</b></div>
      <div class="rs total"><span>Valor final</span><b>${brl(c.total)}</b></div>
      <div class="rs"><span>Pagamento</span><b>${esc(d.forma_pagamento)}${d.num_parcelas > 1 ? ` em ${d.num_parcelas}x` : ' à vista'}</b></div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:0">O estoque dos produtos será atualizado ao confirmar.</p>`, { ok: 'Confirmar venda', title: 'Confirmar venda' })) return;
    busy($('#nvconf', el), async () => {
      try { const id = await q(sb.rpc('registrar_venda', { p: { ...ed.payload(), ...d } })); toast('Venda registrada.', 'ok'); await posVenda(id); }
      catch (e) { falha(e); }
    });
  };
}

      <div class="dl" style="margin:0 0 16px"><div><small>Data</small><b>${fmtDateTime(x.data)}</b></div><div><small>Cliente</small><b>${esc(x.cliente_nome) || '—'}</b></div>

      <div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Item</th><th class="num">Qtd</th><th class="num">Valor unitário</th><th class="num">Total</th></tr></thead><tbody>
      ${itens.map(i => `<tr><td class="first"><span class="badge ${i.tipo === 'produto' ? 'info' : 'ok'}">${i.tipo === 'produto' ? 'Produto' : 'Serviço'}</span> ${esc(i.descricao)}${i.especificacao ? ` <span style="color:var(--muted)">— ${esc(i.especificacao)}</span>` : ''}</td>
        <td data-l="Qtd" class="num">${qtdf(i.quantidade)}</td><td data-l="Valor unitário" class="num">${brl(i.preco_unitario)}</td><td data-l="Total" class="num">${brl(i.total)}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="tot-box"><div class="rs"><span>Subtotal</span><b>${brl(x.subtotal)}</b></div><div class="rs"><span>${descontoTxt(x)}</span><b>- ${brl(x.desconto_total)}</b></div><div class="rs total"><span>Valor total</span><b>${brl(x.total)}</b></div></div>
      <div class="sec-t">Parcelas e recebimentos</div>
      <div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Parcela</th><th>Vencimento</th><th class="num">Valor</th><th class="num">Recebido</th><th>Situação</th><th class="act"></th></tr></thead><tbody>
      ${parcelas.map(p => `<tr><td class="first">${p.numero}/${x.num_parcelas}</td><td data-l="Vencimento">${fmtDate(p.vencimento)}</td><td data-l="Valor" class="num">${brl(p.valor)}</td>
        <td data-l="Recebido" class="num">${brl(p.valor_pago)}${p.pago_em ? `<div style="font-size:12px;color:var(--muted)">${fmtDate(p.pago_em)}</div>` : ''}</td><td data-l="Situação">${canc ? '—' : badgeSit(p.situacao)}</td>
        <td class="act">${!canc && Number(p.saldo) > 0 ? `<button class="btn sm" data-rec="${p.id}">Receber</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div></div>`,
    foot: `${!canc ? `<button class="btn danger" id="dvcanc" style="margin-right:auto">${ico('x')} Cancelar venda</button>` : ''}
      <button class="btn" id="dvmail">${ico('mail')} Enviar por e-mail</button><button class="btn primary" id="dvpdf">${ico('file')} Recibo (PDF)</button>` });
  const gerar = async () => pdfVenda(id);
  $('#dvpdf', m).onclick = () => busy($('#dvpdf', m), async () => { try { const d = await gerar(); baixar(new Blob([d.bytes], { type: 'application/pdf' }), d.nome); } catch (e) { falha(e); } });
  $('#dvmail', m).onclick = () => busy($('#dvmail', m), async () => { try { const d = await gerar(); await enviarPorEmail({ tipo: 'venda', id, numero: x.numero, cliente: d.cliente, doc: d }); } catch (e) { falha(e); } });
  $$('[data-rec]', m).forEach(b => b.onclick = () => { const p = parcelas.find(z => z.id === b.dataset.rec); m.close(); formRecebimento(p, () => { depois(); detalhesVenda(id, depois).catch(falha); }); });
  if ($('#dvcanc', m)) $('#dvcanc', m).onclick = () => {
    const c = openModal({ title: `Cancelar a venda nº ${x.numero}?`, size: 'sm',
      body: `<p style="margin-top:0">Os produtos desta venda voltarão automaticamente ao estoque e as parcelas deixarão de ser cobradas. Esta operação não pode ser desfeita.</p>
        <div class="field"><label>Motivo (opcional)</label><input class="f" id="cmot" maxlength="200"></div>`,
      foot: `<button class="btn" data-close>Voltar</button><button class="btn solid-danger" id="cok">Cancelar venda</button>` });
    $('#cok', c).onclick = () => busy($('#cok', c), async () => {
      try { await q(sb.rpc('cancelar_venda', { p_venda: id, p_motivo: $('#cmot', c).value.trim() })); c.close(); m.close(); toast('Venda cancelada. Estoque devolvido.', 'ok'); depois(); }
      catch (e) { falha(e); }
    });
  };
}

function formRecebimento(p, depois = recarregar) {
  const m = openModal({ title: `Receber — venda nº ${p.venda_numero}, parcela ${p.numero}`, size: 'sm',
    body: `<div class="dl" style="margin:0 0 14px;grid-template-columns:1fr 1fr"><div><small>Cliente</small><b>${esc(p.cliente_nome) || '—'}</b></div><div><small>Vencimento</small><b>${fmtDate(p.vencimento)}</b></div>
      <div><small>Valor da parcela</small><b>${brl(p.valor)}</b></div><div><small>Saldo</small><b>${brl(p.saldo)}</b></div></div>
      <form id="frec" class="grid" style="gap:12px">
        <div class="field"><label>Valor recebido (R$)</label><input class="f" name="valor" data-money inputmode="decimal" value="${nf(p.saldo)}"></div>
        <div class="field"><label>Data do recebimento</label><input class="f" type="date" name="data" value="${hojeISO()}"></div>
        <div class="field"><label>Forma</label><select class="f" name="forma">${FORMAS.map(f => `<option ${f === p.forma_pagamento ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
      </form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="brec">${ico('check')} Registrar recebimento</button>` });
  bindMoney(m);
  const f = $('#frec', m);
  $('#brec', m).onclick = () => busy($('#brec', m), async () => {
    try { await q(sb.rpc('registrar_pagamento', { p_parcela: p.id, p_valor: round2(parseNum(f.valor.value)), p_data: f.data.value || hojeISO(), p_forma: f.forma.value }));
      m.close(); toast('Recebimento registrado.', 'ok'); depois(); }
    catch (e) { falha(e); }
  });
}
