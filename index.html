<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f5f2; --surface:#ffffff; --surface-2:#fafaf8; --line:#e5e3dd; --line-2:#efede8;
  --text:#1d232b; --muted:#6a7079; --soft:#9aa0a8;
  --accent:#1f2a37; --accent-2:#334155; --accent-soft:#eef1f5; --accent-ink:#334155; --on-accent:#ffffff;
  --side-text:#c5ccd5; --side-strong:#ffffff; --side-muted:#8c97a6; --side-hover:rgba(255,255,255,.07); --side-line:rgba(255,255,255,.08);
  --side-on-bg:#ffffff; --side-on-text:#1f2a37;
  --ok:#2f7a55; --ok-soft:#e8f3ed; --warn:#a86a12; --warn-soft:#fbf2e2; --bad:#b4372f; --bad-soft:#fbeceb;
  --info:#2d5d8a; --info-soft:#e8f0f8;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(20,24,30,.05),0 4px 16px rgba(20,24,30,.05);
  --side:244px;
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
.topbar{padding-top:calc(10px + env(safe-area-inset-top))!important}
body{background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.only-m{display:none}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:var(--side);background:var(--accent);color:var(--side-text);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 12px 14px 18px;border-bottom:1px solid var(--side-line)}
.brand-logo{width:38px;height:38px;border-radius:10px;background:var(--side-hover);display:grid;place-items:center;overflow:hidden;flex:none}
.brand-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand b{color:var(--side-strong);font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.brand small{color:var(--side-muted);font-size:12px}
.nav{padding:10px 10px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-text);text-decoration:none;margin:1px 0;font-size:14px}
.nav a:hover{background:var(--side-hover);color:var(--side-strong)}
.nav a.on{background:var(--side-on-bg);color:var(--side-on-text);font-weight:600}
.nav a.off{opacity:.45;cursor:not-allowed}
.nav a .tag{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:20px}
.side-foot{padding:12px 14px;border-top:1px solid var(--side-line);font-size:12.5px;color:var(--side-muted);display:flex;align-items:center;gap:8px}
.side-foot span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot button{background:none;border:0;color:var(--side-text);cursor:pointer;padding:6px;border-radius:7px;display:flex}
.side-foot button:hover{background:var(--side-hover);color:var(--side-strong)}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar b{font-size:15px}
.content{padding:26px 30px 60px;max-width:1320px;width:100%}
.scrim{display:none}
.demo-bar{display:flex;align-items:center;gap:10px;padding:9px 30px;background:var(--warn-soft);color:#6e470d;font-size:13px;border-bottom:1px solid #f0dfbd;flex-wrap:wrap}
.demo-bar span{flex:1;min-width:200px}
@media (max-width:900px){.demo-bar{padding:8px 14px}}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:22px;margin:0;letter-spacing:-.01em}
.page-h p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- elementos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2);border-color:#d6d3cc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:#efcfcc}
.btn.danger:hover{background:var(--bad-soft)}
.btn.solid-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--text)}
.icon-btn.bad:hover{background:var(--bad-soft);color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-2);gap:10px}
.card-h h3{margin:0;font-size:14.5px}
.card-b{padding:16px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:11px;top:10px;color:var(--soft)}
.search input.f{padding-left:36px}
input.f,select.f,textarea.f{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);outline:none}
textarea.f{height:auto;min-height:74px;padding:9px 11px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{border-color:#8a96a6;box-shadow:0 0 0 3px rgba(51,65,85,.10)}
input.f[readonly]{background:var(--surface-2);font-weight:600}
select.f{padding-right:28px}
.toolbar select.f{width:auto;min-width:170px}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:13.5px;color:var(--muted)}
.chk input{width:16px;height:16px;accent-color:var(--accent)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12px;color:var(--soft)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.sec-t svg.i{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:700;margin:18px 0 10px}
.sec-t:first-child{margin-top:0}

/* tabela */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:#fbfaf7}
table.t .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t .act{text-align:right;white-space:nowrap;width:1%}
table.t .muted{color:var(--muted)}
table.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--line-2);display:grid;place-items:center;color:var(--soft);flex:none}
.prod-cell{display:flex;align-items:center;gap:11px}
.prod-cell b{display:block;font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--soft);margin-bottom:6px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--line-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.kpi .ic.warn{background:var(--warn-soft);color:var(--warn)}
.kpi .ic.ok{background:var(--ok-soft);color:var(--ok)}
.kpi small{color:var(--muted);font-size:12.5px;display:block}
.kpi b{font-size:20px;letter-spacing:-.01em;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#d0ccc3}

.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;margin-bottom:14px;font-size:13.5px}
.alert.warn{background:var(--warn-soft);color:#7a4c0c}
.alert.info{background:var(--info-soft);color:#24496b}
.alert.bad{background:var(--bad-soft);color:#8c2a24}
.alert button{margin-left:auto}

/* opções da base de cálculo */
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
.opt{padding:18px;cursor:pointer;display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;border:1.5px solid var(--line)}
.opt:hover{border-color:#bfc6d0}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.opt.on .ic{background:var(--accent);color:var(--on-accent)}
.opt b{font-size:15px;letter-spacing:.04em}
.opt p{margin:2px 0 0;color:var(--muted);font-size:13px}
.opts.compact .opt{padding:12px 14px}
.opts.compact .opt p{display:none}
.opts.compact .opt .ic{width:34px;height:34px}

/* composição de preço */
.compo{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:14px}
.compo .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2);margin:10px 0 12px}
.compo .bar i{display:block;height:100%}
.compo .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px}
.compo .row span:first-child{display:flex;align-items:center;gap:7px;color:var(--muted)}
.compo .row b{font-variant-numeric:tabular-nums}
.compo .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:15px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.c-mat{background:#64748b}.c-hor{background:#a3b1c2}.c-luc{background:#2f7a55}.c-neg{background:#b4372f}
.pz{border:1px solid var(--line-2);border-radius:10px;padding:12px 14px 10px;margin-bottom:12px;background:var(--surface)}
.pz-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.pz-n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;display:grid;place-items:center;font-weight:700}
.pz-tot{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.pz-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.pz-foot .hint{font-size:12px;color:var(--soft)}
.mat-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 34px;gap:10px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line-2)}
.mat-row:last-child{border-bottom:0}
.mat-row .mat-rm{margin-bottom:2px}
input.f.erro{border-color:var(--bad);background:var(--bad-soft)}
.compo .row.sub{font-size:12.5px;color:var(--muted);padding:1px 0 1px 16px}
.compo .row.sub span:first-child{color:var(--muted)}
.formula{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:9px 12px}

/* serviços em cards */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.svc{overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.svc:hover{border-color:#cfcac0}
.svc .ph{height:132px;background:var(--line-2);display:grid;place-items:center;color:var(--soft)}
.svc .ph img{width:100%;height:100%;object-fit:cover}
.svc .ph svg{width:34px;height:34px}
.svc .bd{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.svc .bd b{font-size:14.5px}
.svc .bd small{color:var(--muted)}
.svc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.svc .price{font-size:16px;font-weight:700}

/* foto upload */
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .pv{width:96px;height:96px;border-radius:12px;background:var(--line-2);display:grid;place-items:center;overflow:hidden;color:var(--soft);border:1px dashed #d2cec5;flex:none}
.photo-pick .pv img{width:100%;height:100%;object-fit:cover}
.photo-pick .pv.logo img{object-fit:contain;background:#fff}

/* detalhes */
.det-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:16px}
.det-head .big{width:120px;height:120px;border-radius:14px;object-fit:cover;background:var(--line-2);display:grid;place-items:center;color:var(--soft);flex:none}
.det-head h2{margin:0;font-size:19px}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px;margin-top:10px}
.dl div small{display:block;color:var(--muted);font-size:12px}
.dl div b{font-weight:600}
.contact a{display:inline-flex;align-items:center;gap:6px;margin-right:14px;text-decoration:none}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,22,29,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto;animation:fade .12s}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:pop .14s}
.modal.lg{max-width:900px}.modal.sm{max-width:430px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.modal-h h3{margin:0;font-size:16.5px}
.modal-b{padding:18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(8px);opacity:.6}}

.seg{display:inline-flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#1f2a37;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13.5px;max-width:360px;animation:pop .15s}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

.loading{padding:60px;text-align:center;color:var(--muted)}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* telas de acesso */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{width:100%;max-width:410px;padding:28px}
.gate h1{font-size:21px;margin:12px 0 4px}
.gate p{color:var(--muted);margin:0 0 18px;font-size:13.5px}
.gate .mark img{width:100%;height:100%;border-radius:12px;display:block}
.gate .mark{width:46px;height:46px;border-radius:12px;overflow:hidden;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.gate form{display:flex;flex-direction:column;gap:12px}
.gate .msg{font-size:13px;padding:9px 12px;border-radius:8px}
.gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gate-brand b{font-size:15px;letter-spacing:.01em}
.gate-brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.linkbtn{background:none;border:0;color:var(--info);cursor:pointer;padding:0;font-size:13px}

/* editor de vendas/orçamentos */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.ed-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.ed-side{position:sticky;top:16px}
.inline{display:flex;gap:8px;align-items:center}
.inline .f{flex:1}
.inline.datas .f{width:auto;min-width:0}
.additem{display:flex;gap:8px;align-items:flex-end;margin:12px 0 10px;flex-wrap:wrap}
input.f.qtd{width:90px;text-align:right;height:34px}
.rs{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.rs span{color:var(--muted)}
.rs b{font-variant-numeric:tabular-nums}
.rs.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px}
.rs.total span{color:var(--text);font-weight:600}
.btn.big{width:100%;height:46px;margin-top:14px;font-size:15px;letter-spacing:.02em}
.tot-box{max-width:340px;margin:12px 0 4px auto}
.parc-prev{display:flex;flex-wrap:wrap;gap:8px}
.parc-prev span{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;min-width:110px}
.parc-prev small{color:var(--muted);font-size:11.5px}
.okmark{width:54px;height:54px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.okmark svg{width:28px;height:28px}
.rel-f{grid-template-columns:repeat(4,minmax(0,1fr))}
/* gráfico */
.chart-wrap{position:relative}
svg.chart{width:100%;height:auto;display:block}
svg.chart .ax{font-size:11px;fill:#8a9099;font-family:inherit}
svg.chart .gm.on rect{fill:rgba(31,42,55,.04)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i,.tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:200px;z-index:5}
.tip div{display:flex;align-items:center;margin-top:3px}
.tip span{margin-left:auto;padding-left:12px;font-weight:600;font-variant-numeric:tabular-nums}
.rk{margin-bottom:10px}
.rk-t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:4px}
.rk-t b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rk-b{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.rk-b i{display:block;height:100%;background:#2f62b0;border-radius:4px}

/* menu: alfinete e modo suspenso */
.pin{margin-left:auto;background:none;border:0;color:var(--side-muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.pin:hover{background:var(--side-hover);color:var(--side-strong)}
.pin.on{color:var(--side-strong)}
.pin.on svg{fill:currentColor}
body.menu-solto .side{transform:translateX(-100%);box-shadow:none}
body.menu-solto .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
body.menu-solto .main{margin-left:0}
body.menu-solto .topbar{display:flex}
body.menu-solto .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
.topbar .tb-emp{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-width:0}
.topbar .tb-emp img{width:28px;height:28px;border-radius:7px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.topbar .tb-emp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
/* configurações em lista */
.set-list{overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;cursor:pointer}
.set-row:last-child{border-bottom:0}
.set-row:hover{background:var(--surface-2)}
.set-row .ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.set-row div{flex:1;min-width:0}
.set-row b{display:block;font-size:15px}
.set-row small{color:var(--muted);font-size:13px}
.set-row .chev{color:var(--soft)}
.set-back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13.5px;margin-bottom:6px}
.set-back:hover{color:var(--text)}
.set-sec{max-width:860px}
/* interruptor */
.sw{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#cfccc4;border-radius:20px;transition:.15s;cursor:pointer}
.sw i::after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:disabled+i{opacity:.5;cursor:not-allowed}
.opt-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.opt-row:last-child{border-bottom:0}
.opt-row .tx{flex:1;min-width:0}
.opt-row .tx b{display:block}
.opt-row .tx small{color:var(--muted);font-size:12.5px}
.mn-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;margin-bottom:6px;background:var(--surface)}
.mn-row.drag{opacity:.5}
.mn-row.over{border-color:var(--accent)}
.mn-row .hd{cursor:grab;color:var(--soft);display:grid;place-items:center}
.mn-row .nm{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.mn-row .nm small{color:var(--muted);font-size:12px}
.mn-row.fora .nm{opacity:.5}
.mn-row .mv{display:flex;gap:2px}
/* cores */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tema{border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px}
.tema.on{border-color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
.tema .pv{display:flex;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--line-2)}
.tema .pv i:first-child{width:34%}
.tema .pv i:last-child{flex:1}
.tema span{font-size:13px;font-weight:500}
.cor-in{display:flex;align-items:center;gap:10px}
.cor-in input[type=color]{width:48px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.previa{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:150px}
.previa .ps{width:30%;background:var(--accent);padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.previa .ps i{display:block;height:9px;border-radius:5px;background:var(--side-hover)}
.previa .ps i.on{background:var(--side-on-bg)}
.previa .pm{flex:1;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.previa .pm .c{background:var(--surface);border:1px solid var(--line);border-radius:8px;height:40px}
.previa .pm .b{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-radius:7px;padding:5px 12px;font-size:12px}

/* ---------- responsivo ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ed{grid-template-columns:1fr}.ed-side{position:static}.rel-f{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .pin{display:none}
  .side{transform:translateX(-100%)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .main{margin-left:0}
  .topbar{display:flex}
  .content{padding:16px 14px calc(50px + env(safe-area-inset-bottom))}
  .opts:not(.compact){grid-template-columns:1fr!important}

  .opts.compact .opt{flex-direction:column;gap:6px;padding:10px;text-align:center}
  .opts.compact .opt b{font-size:12px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  input.f,select.f,textarea.f{font-size:16px;height:42px}

  .kpis>.kpi:last-child:nth-child(odd){grid-column:span 2}
  .toolbar>select.f{flex:1 1 100%;width:100%}
  .toolbar>.seg{width:100%;display:flex}
  .toolbar>.seg button{flex:1;padding:7px 6px}
  .toolbar>span[style*="flex:1"]{display:none}
  .toolbar>.btn{flex:1 1 100%}
  .opts.compact{gap:8px}
  .opts.compact .opt{padding:10px 4px;border-radius:12px}
  .opts.compact .opt b{font-size:11.5px;letter-spacing:.02em}
  table.t.resp td[data-l="Composição"]{flex-direction:column;align-items:flex-end;text-align:right}
  .toolbar .inline.datas{width:100%}
  .toolbar .inline.datas .f{flex:1;width:0}
  textarea.f{height:auto}
  .btn{height:40px}
  .btn.sm{height:34px}
  .page-h{margin-bottom:14px}
  .page-h .actions{width:100%}
  .page-h .actions .btn{flex:1}
  .toasts{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .toast{max-width:none}
  .card-b{padding:14px}
  .dl{grid-template-columns:1fr 1fr!important}
  .tot-box{max-width:none}
  .set-row{padding:14px}
  .temas{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px;flex-direction:column;gap:8px}.kpi b{font-size:17px}
  .g2,.g3,.g4,.rel-f{grid-template-columns:1fr}
  .toolbar .seg{flex-wrap:wrap}
  input.f.qtd{width:100%}
  .additem .field{width:100%!important}
  .additem .btn{width:100%}
  .mat-row{grid-template-columns:1fr 1fr;gap:8px}
  .mat-row .mat-desc{grid-column:1/-1}
  .mat-row .mat-rm{justify-self:end}
  .span2,.span3{grid-column:auto}

  .toolbar select.f{flex:1;min-width:0}
  .page-h h1{font-size:19px}
  .modal-bg{padding:0;align-items:stretch}
  .modal{border-radius:0;min-height:100%;max-width:none!important}
  .det-head{flex-direction:column}
  /* tabelas viram cartões */
  table.t.resp thead{display:none}
  table.t.resp,table.t.resp tbody,table.t.resp tr,table.t.resp td{display:block;width:100%}

  table.t.resp td{border:0;padding:4px 10px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.t.resp td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left}
  table.t.resp td.first{display:block;text-align:left}
  table.t.resp td.first::before{display:none}
  table.t.resp td.act{width:auto;justify-content:flex-end}
  table.t.resp td.act::before{display:none}
  table.t.resp td.mh{display:none}
  .only-m{display:block}
}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brlFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = v => brlFmt.format(Number(v) || 0);
const nf = (v, d = 2) => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const qtdf = v => (Number(v) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const round2 = v => Math.round((Number(v) + Number.EPSILON) * 100) / 100;
function parseNum(s) {
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim().replace(/\s|R\$|%/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const fmtIn = (v, d = 2) => (v === null || v === undefined || v === '') ? '' : nf(v, d);
const fmtDate = d => d ? new Date(String(d).length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('pt-BR') : '—';
const fmtDateTime = d => d ? new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function toLocalInput(d = new Date()) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); }
function fmtDoc(v) {
  const d = String(v || '').replace(/\D/g, '');
  if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');

}

  layers:'<path d="M12 2l10 5-10 5L2 7l10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',

const ico = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* Avisos */
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), type === 'bad' ? 6000 : 3200);
}

/* Janelas */
function openModal({ title, body, foot = '', size = '', dismiss = false }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Fechar">${ico('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(bg);
  document.body.style.overflow = 'hidden';
  const close = () => { bg.remove(); if (!$('.modal-bg')) document.body.style.overflow = ''; };
  bg.addEventListener('click', e => {
    if (e.target.closest('[data-close]') || (dismiss && e.target === bg)) close();
  });
  bg.close = close;
  const first = $('input:not([type=hidden]):not([readonly]),select,textarea', bg);
  if (first && window.innerWidth > 640) setTimeout(() => { if (!bg.contains(document.activeElement)) first.focus(); }, 30);
  return bg;

/* Fotos: reduz a imagem e envia ao Storage */
function resizeImage(file, max = 1000, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error('Não foi possível ler a imagem.')), type, 0.86);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error('Arquivo de imagem inválido.'));
    img.src = URL.createObjectURL(file);
  });
}
async function uploadFoto(file, pasta, { png = false } = {}) {
  const type = png ? 'image/png' : 'image/jpeg';
  const blob = await resizeImage(file, MODO_DEMO ? (png ? 300 : 500) : (png ? 600 : 1000), type);
  const path = `${S.empresa.id}/${pasta}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${png ? 'png' : 'jpg'}`;
  await q(sb.storage.from('fotos').upload(path, blob, { contentType: type, upsert: false }));
  return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
}
async function removerFoto(url) {
  if (!url) return;
  if (MODO_DEMO) { try { await sb.storage.from('fotos').removerPorUrl(url); } catch (e) {} return; }
  const i = url.indexOf('/fotos/');
  if (i < 0) return;
  const path = decodeURIComponent(url.slice(i + 7).split('?')[0]);
  try { await sb.storage.from('fotos').remove([path]); } catch (e) { /* mantém o fluxo */ }
}

      const porProd = {};
      itens.filter(i => i.tipo === 'produto' && i.produto_id).forEach(i => porProd[i.produto_id] = (porProd[i.produto_id] || 0) + Number(i.quantidade));
      Object.entries(porProd).forEach(([pid, q]) => { const mv = { id: uid(), empresa_id: emp(), produto_id: pid, tipo: 'venda', delta: -q, custo_unitario: null, fornecedor_id: null, documento: '', venda_id: venda.id, observacao: 'Venda nº ' + venda.numero, data: agora(), usuario_id: USER.id }; aplicarMov(mv)(); db.movimentacoes_estoque.push(mv); });
      const parc = round2(total / n), venc = p.primeiro_vencimento || hoje(); let acum = 0;
      for (let i = 1; i <= n; i++) {
        const valor = i === n ? round2(total - acum) : parc; acum = round2(acum + parc);
        const pago = p.pago_agora && i === 1;
        db.parcelas.push({ id: uid(), empresa_id: emp(), venda_id: venda.id, numero: i, valor, vencimento: addMeses(venc, i - 1), valor_pago: pago ? valor : 0, pago_em: pago ? hoje() : null, forma_pagamento: p.forma_pagamento || '', observacao: '', atualizado_em: agora() });
      }
      if (orc) { orc.status = 'convertido'; orc.venda_id = venda.id; }
      return venda.id;
    }),
    cancelar_venda: ({ p_venda, p_motivo }) => atomico(() => {
      const v = db.vendas.find(x => x.id === p_venda); if (!v) throw { message: 'Venda não encontrada.' };
      if (v.status === 'cancelada') throw { message: 'Esta venda já está cancelada.' };
      const porProd = {};
      db.venda_itens.filter(i => i.venda_id === v.id && i.tipo === 'produto' && i.produto_id).forEach(i => porProd[i.produto_id] = (porProd[i.produto_id] || 0) + Number(i.quantidade));
      Object.entries(porProd).forEach(([pid, q]) => { if (!db.produtos.find(x => x.id === pid)) return; const mv = { id: uid(), empresa_id: emp(), produto_id: pid, tipo: 'cancelamento_venda', delta: q, custo_unitario: null, fornecedor_id: null, documento: '', venda_id: v.id, observacao: 'Cancelamento da venda nº ' + v.numero, data: agora(), usuario_id: USER.id }; aplicarMov(mv)(); db.movimentacoes_estoque.push(mv); });
      Object.assign(v, { status: 'cancelada', cancelada_em: agora(), motivo_cancelamento: p_motivo || '' });
      const o = db.orcamentos.find(x => x.id === v.orcamento_id); if (o) { o.status = 'aprovado'; o.venda_id = null; }
      return null;
    }),
    salvar_orcamento: ({ p }) => atomico(() => {
      const status = p.status || 'aberto';
      if (!['aberto', 'enviado', 'aprovado', 'recusado'].includes(status)) throw { message: 'Situação inválida.' };
      if (!(p.itens || []).length) throw { message: 'Adicione ao menos um item.' };
      const itens = p.itens.map(itemDoCadastro);
      const cli = db.clientes.find(c => c.id === p.cliente_id);
      let o;
      if (p.id) {
        o = db.orcamentos.find(x => x.id === p.id); if (!o) throw { message: 'Orçamento não encontrado.' };
        if (o.status === 'convertido') throw { message: 'Este orçamento já foi convertido em venda e não pode ser alterado.' };
        db.orcamento_itens = db.orcamento_itens.filter(i => i.orcamento_id !== o.id);
      } else {
        o = { id: uid(), empresa_id: emp(), numero: proximoNumero('orcamentos'), data: agora(), venda_id: null, usuario_id: USER.id, criado_em: agora() };
        db.orcamentos.push(o);
      }
      const sub = round2(itens.reduce((s, i) => s + i.total, 0)), dtipo = p.desconto_tipo || 'valor', dval = Number(p.desconto_valor) || 0, desc = descontoDe(sub, dtipo, dval);
      Object.assign(o, { cliente_id: cli?.id || null, cliente_nome: cli?.nome || '', validade: p.validade || null, desconto_tipo: dtipo, desconto_valor: dval,
        observacao: p.observacao || '', status, subtotal: sub, desconto_total: desc, total: round2(sub - desc), atualizado_em: agora() });
      itens.forEach(i => db.orcamento_itens.push({ id: uid(), empresa_id: emp(), orcamento_id: o.id, ...i }));
      return o.id;
    }),
    registrar_pagamento: ({ p_parcela, p_valor, p_data, p_forma }) => atomico(() => {
      const pa = db.parcelas.find(x => x.id === p_parcela); if (!pa) throw { message: 'Parcela não encontrada.' };
      if (db.vendas.find(v => v.id === pa.venda_id)?.status === 'cancelada') throw { message: 'Esta venda foi cancelada.' };
      if (!(Number(p_valor) > 0)) throw { message: 'Informe um valor maior que zero.' };
      if (Number(p_valor) > pa.valor - pa.valor_pago + 0.001) throw { message: `O valor informado é maior que o saldo da parcela (${brl(pa.valor - pa.valor_pago)}).` };
      pa.valor_pago = round2(pa.valor_pago + Number(p_valor)); pa.pago_em = p_data || hoje(); if (p_forma) pa.forma_pagamento = p_forma;
      return null;
    }),
    estornar_pagamento: ({ p_parcela }) => atomico(() => {
      const pa = db.parcelas.find(x => x.id === p_parcela); if (!pa) throw { message: 'Parcela não encontrada.' };
      pa.valor_pago = 0; pa.pago_em = null; return null;
    }),
  };
  const indisponivel = { message: 'Indisponível no modo de visualização. Conecte ao Supabase para usar esta função.' };
  return {
    from: t => new Consulta(t),
    rpc: async (fn, a = {}) => {
      if (fn === 'minha_empresa') return { data: emp(), error: null };
      if (fn === 'criar_minha_empresa') {
        if (!emp()) {
          const e = { id: uid(), ...PADRAO.empresas, razao_social: a.p_nome || '', nome_fantasia: a.p_nome || '', criado_em: agora(), atualizado_em: agora() };
          db.empresas.push(e); db.membros.push({ empresa_id: e.id, user_id: USER.id, papel: 'admin', criado_em: agora() }); guardar();
        }
        return { data: emp(), error: null };
      }
      if (RPC[fn]) return RPC[fn](a);
      if (fn === 'listar_membros') return { data: db.membros.map(m => ({ user_id: m.user_id, email: USER.email, papel: m.papel, criado_em: m.criado_em })), error: null };
      return { data: null, error: indisponivel };
    },
    auth: {
      async getSession() { return { data: { session: { user: USER } } }; },
      async getUser() { return { data: { user: USER } }; },
      onAuthStateChange() { return { data: { subscription: { unsubscribe() {} } } }; },
      async signOut() { return { error: null }; },
      async updateUser() { return { data: null, error: indisponivel }; },
      async resetPasswordForEmail() { return { error: indisponivel }; },
    },
    storage: { from: () => ({
      async upload(path, blob) {
        const url = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(blob); });
        fotos[path] = url;
        try { guardar(); } catch (e) { delete fotos[path]; return { data: null, error: e }; }
        return { data: { path }, error: null };
      },
      getPublicUrl(path) { return { data: { publicUrl: fotos[path] || '' } }; },
      async remove(paths) { paths.forEach(p => delete fotos[p]); guardar(); return { data: {}, error: null }; },
      async removerPorUrl(url) { Object.keys(fotos).forEach(k => { if (fotos[k] === url) delete fotos[k]; }); guardar(); },
    }) },
  };
}

async function sair() { if (MODO_DEMO) return telaConexao(); await sb.auth.signOut(); S.user = null; S.empresa = null; telaLogin(); }

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
async function iniciar(conectando = false) {
  const cfg = getCfg();
  if (!cfg) {                       // sem Supabase configurado: abre direto no modo de visualização
    MODO_DEMO = true; sb = criarClienteLocal();
    return aposLogin();
  }
  MODO_DEMO = false;
  if (!window.supabase || !window.supabase.createClient) {
    $('#root').innerHTML = `<div class="gate"><div class="card"><h1>Sem conexão</h1><p>Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue a página.</p><button class="btn primary" onclick="location.reload()">Recarregar</button></div></div>`;
    return;
  }
  try { sb = window.supabase.createClient(cfg.url, cfg.key); }
  catch (e) { localStorage.removeItem(CFG_KEY); return telaConexao('Dados de conexão inválidos.'); }
  let recuperando = /type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev) => {
    if (ev === 'PASSWORD_RECOVERY') { recuperando = true; telaNovaSenha(); }
    if (ev === 'SIGNED_OUT') { S.user = null; }
  });
  const { data } = await sb.auth.getSession();
  if (recuperando && data.session) return telaNovaSenha();
  if (!data.session) return telaLogin();
  await aposLogin();
}

async function aposLogin() {
  $('#root').innerHTML = '<div class="loading"><span class="spin"></span></div>';
  try {
    const { data: u } = await sb.auth.getUser();
    S.user = u.user;
    if (!S.user) return telaLogin();
    const emp = await q(sb.rpc('minha_empresa'));
    if (!emp) return telaEmpresaInicial();
    const [empresa, membro] = await Promise.all([
      q(sb.from('empresas').select('*').eq('id', emp).single()),
      q(sb.from('membros').select('papel').eq('user_id', S.user.id).single()),
    ]);
    S.empresa = empresa; S.papel = membro.papel;
    montarApp();
  } catch (e) {
    const msg = traduzErro(e);
    $('#root').innerHTML = `<div class="gate"><div class="card"><div class="mark">${ico('alert')}</div><h1>Não foi possível abrir</h1>
      <p>${esc(msg)}</p><div class="actions"><button class="btn primary" onclick="location.reload()">Tentar novamente</button>
      <button class="btn" id="gsair">Sair</button>${getCfg()?.fixed ? '' : '<button class="btn" id="gcon">Trocar conexão</button>'}</div></div></div>`;
    $('#gsair').onclick = sair;
    if ($('#gcon')) $('#gcon').onclick = () => { localStorage.removeItem(CFG_KEY); location.reload(); };
  }
}

const PREF_PADRAO = { tema: { principal: '#1f2a37', fundo: '#f5f5f2' }, mercadorias: true, servicos: true, ocultos: [], ordem: [] };
function prefs() {
  const p = (S.empresa && S.empresa.preferencias) || {};
  return { ...PREF_PADRAO, ...p, tema: { ...PREF_PADRAO.tema, ...(p.tema || {}) }, ocultos: p.ocultos || [], ordem: p.ordem || [] };
}
const temProd = () => prefs().mercadorias !== false;
const temServ = () => prefs().servicos !== false;
const EXIGE = { estoque: 'mercadorias', servicos: 'servicos' };
function moduloAtivo(id, p = prefs()) {
  if (id === 'configuracoes') return true;
  if (EXIGE[id] && p[EXIGE[id]] === false) return false;
  return !p.ocultos.includes(id);
}
function menuOrdenado(p = prefs()) {
  const ord = p.ordem.filter(id => MENU.some(m => m.id === id));
  MENU.forEach(m => { if (!ord.includes(m.id)) ord.push(m.id); });
  return ord.map(id => MENU.find(m => m.id === id));
}
/* cores */
const hexRgb = h => { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbHex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mistura = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return rgbHex(x.map((v, i) => v + (y[i] - v) * t)); };
const luminancia = h => { const c = hexRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const valido = h => /^#[0-9a-f]{6}$/i.test(h || '');
function fundoLegivel(f) { let x = valido(f) ? f : PREF_PADRAO.tema.fundo; let k = 0; while (luminancia(x) < 0.78 && k < 20) { x = mistura(x, '#ffffff', 0.2); k++; } return x; }
function aplicarTema(t = prefs().tema) {
  const p = valido(t.principal) ? t.principal : PREF_PADRAO.tema.principal, f = fundoLegivel(t.fundo);

/* =====================================================================
   FORMAÇÃO DE PREÇO — PRODUTO (usada no Estoque e na Base de Cálculo)
   Materiais: Valor original ÷ Quantidade original × Quantidade utilizada
   Horas:     Valor da hora × Quantidade de horas trabalhadas
   Preço:     (Materiais + Horas) × (1 + Lucro%)   — lucro opcional
   ===================================================================== */
const calcMaterial = m => {
  const qo = parseNum(m.qtd_original);
  return qo > 0 ? parseNum(m.valor_original) / qo * parseNum(m.qtd_utilizada) : 0;
};
/* Compatibilidade: produto antigo sem composição detalhada */
function composicaoInicial(p) {
  let mats = Array.isArray(p.materiais) && p.materiais.length ? p.materiais : null;
  if (!mats) mats = Number(p.custo_materiais) > 0
    ? [{ descricao: '', valor_original: Number(p.custo_materiais), qtd_original: 1, qtd_utilizada: 1 }]
    : [{ descricao: '', valor_original: '', qtd_original: '', qtd_utilizada: '' }];
  let vh = Number(p.valor_hora) || 0, h = Number(p.horas_trabalhadas) || 0;
  if (!vh && !h && Number(p.custo_horas) > 0) { vh = Number(p.custo_horas); h = 1; }
  return { mats, vh, h };
}
function linhaMaterial(m = {}) {
  const v = (x, d) => (x === '' || x == null) ? '' : (d === 'q' ? qtdf(x) : nf(x));
  return `<div class="mat-row" data-mat>

    <div class="field"><label>Valor original (R$)</label><input class="f" data-k="valor_original" data-money inputmode="decimal" value="${v(m.valor_original)}"></div>
    <div class="field"><label>Quantidade original</label><input class="f" data-k="qtd_original" data-money data-dec="q" inputmode="decimal" value="${v(m.qtd_original, 'q')}"></div>
    <div class="field"><label>Quantidade utilizada</label><input class="f" data-k="qtd_utilizada" data-money data-dec="q" inputmode="decimal" value="${v(m.qtd_utilizada, 'q')}"></div>
    <div class="field"><label>Valor do material</label><input class="f" data-v readonly tabindex="-1"></div>
    <button type="button" class="icon-btn bad mat-rm" title="Remover material">${ico('trash')}</button>
  </div>`;
}
function blocoPrecoProduto(p = {}) {

function lerComposicao(root) {
  const mats = $$('[data-mat]', root).map(r => ({
    descricao: $('[data-k=descricao]', r).value.trim(),
    valor_original: round2(parseNum($('[data-k=valor_original]', r).value)),
    qtd_original: parseNum($('[data-k=qtd_original]', r).value),
    qtd_utilizada: parseNum($('[data-k=qtd_utilizada]', r).value),
    _vazio: !$('[data-k=descricao]', r).value.trim() && ['valor_original', 'qtd_original', 'qtd_utilizada'].every(k => !$(`[data-k=${k}]`, r).value.trim()),
  }));
  const vh = parseNum($('[name=valor_hora]', root).value), h = parseNum($('[name=horas_trabalhadas]', root).value);
  const luc = parseNum($('[name=lucro_percentual]', root).value);
  const matTot = mats.reduce((s, m) => s + calcMaterial(m), 0);
  const cm = round2(matTot), ch = round2(vh * h);
  return { mats, vh, h, luc, cm, ch, custo: round2(cm + ch), preco: round2((cm + ch) * (1 + luc / 100)) };
}
function ligarPrecoProduto(root) {
  const lista = $('[data-mats]', root);
  const pintar = () => {
    const c = lerComposicao(root);
    $$('[data-mat]', root).forEach((r, i) => {
      const m = c.mats[i], qo = m.qtd_original;
      const out = $('[data-v]', r);
      out.value = m._vazio ? '' : brl(calcMaterial(m));
      out.classList.toggle('erro', !m._vazio && !(qo > 0));
      $('[data-k=qtd_original]', r).classList.toggle('erro', !m._vazio && !(qo > 0));
    });
    $$('.mat-rm', root).forEach(b => b.classList.toggle('hidden', $$('[data-mat]', root).length < 2));
    $('[data-totmat]', root).textContent = brl(c.cm);
    $('[data-tothor]', root).textContent = brl(c.ch);
    $('[name=valor_horas]', root).value = brl(c.ch);
    $('[name=preco_venda]', root).value = brl(c.preco);
    const lucV = c.preco - c.custo, base = Math.max(c.preco, c.custo) || 1;
    const margem = c.preco > 0 ? lucV / c.preco * 100 : 0;
    const usados = c.mats.filter(m => !m._vazio);
    $('[data-compo]', root).innerHTML = `<b style="font-size:13px">Composição do preço</b>
      <div class="bar"><i class="c-mat" style="width:${c.cm / base * 100}%"></i><i class="c-hor" style="width:${c.ch / base * 100}%"></i><i class="${lucV >= 0 ? 'c-luc' : 'c-neg'}" style="width:${Math.abs(lucV) / base * 100}%"></i></div>
      <div class="row"><span><i class="dot c-mat"></i>Materiais</span><b>${brl(c.cm)}</b></div>
      ${usados.map(m => `<div class="row sub"><span>${esc(m.descricao || 'Material')} — ${brl(m.valor_original)} ÷ ${qtdf(m.qtd_original)} × ${qtdf(m.qtd_utilizada)}</span><span>${brl(calcMaterial(m))}</span></div>`).join('')}
      <div class="row"><span><i class="dot c-hor"></i>Horas — ${brl(c.vh)} × ${nf(c.h)} h</span><b>${brl(c.ch)}</b></div>
      <div class="row"><span>Custo total</span><b>${brl(c.custo)}</b></div>
      <div class="row"><span><i class="dot ${lucV >= 0 ? 'c-luc' : 'c-neg'}"></i>Lucro (${nf(c.luc)}% sobre o custo · ${nf(margem)}% do preço)</span><b>${brl(lucV)}</b></div>
      <div class="row tot"><span><b style="color:var(--text)">Preço final</b></span><b>${brl(c.preco)}</b></div>`;
  };
  const prepararLinha = r => {
    bindMoney(r);
    $('.mat-rm', r).onclick = () => { r.remove(); pintar(); };
  };
  $$('[data-mat]', root).forEach(prepararLinha);
  $('[data-addmat]', root).onclick = () => {
    lista.insertAdjacentHTML('beforeend', linhaMaterial());
    const r = lista.lastElementChild; prepararLinha(r); pintar();
    $('[data-k=descricao]', r).focus();
  };
  $('[data-preco]', root).addEventListener('input', pintar);
  $('[data-preco]', root).addEventListener('focusout', () => setTimeout(pintar, 0));
  pintar();
  return { pintar };
}
function lerPrecoProduto(root) {
  const c = lerComposicao(root);
  const mats = c.mats.filter(m => !m._vazio);
  mats.forEach((m, i) => {
    if (!(m.qtd_original > 0)) throw new Error(`Informe a quantidade original do material ${m.descricao ? '"' + m.descricao + '"' : 'nº ' + (i + 1)} (maior que zero).`);
    if (m.valor_original < 0 || m.qtd_utilizada < 0) throw new Error('Os valores dos materiais não podem ser negativos.');
  });
  if (c.vh < 0 || c.h < 0) throw new Error('Os valores das horas não podem ser negativos.');
  return {
    materiais: mats.map(({ _vazio, ...m }) => m),
    valor_hora: round2(c.vh), horas_trabalhadas: round2(c.h),
    custo_materiais: c.cm, custo_horas: c.ch,
    lucro_percentual: round2(c.luc), preco_venda: c.preco,
  };
}

/* Aviso de duplicidade ao digitar nome + especificação */
function ligarDuplicidade(root, lista, atualId, rotulo, aoAbrir) {
  const box = $('[data-dup]', root);
  const ver = () => {
    const n = norm($('[name=nome]', root).value), e = norm($('[name=especificacao]', root).value);
    const ex = n && lista.find(x => x.id !== atualId && norm(x.nome) === n && norm(x.especificacao) === e);
    if (ex) {
      box.innerHTML = `<div class="alert warn" style="margin:0 0 12px">${ico('alert')} Já existe ${rotulo} "${esc(ex.nome)}${ex.especificacao ? ' — ' + esc(ex.especificacao) : ''}" cadastrado.
        <button type="button" class="btn sm">Abrir cadastro existente</button></div>`;
      $('button', box).onclick = () => aoAbrir(ex);
    } else box.innerHTML = '';
    return ex;
  };
  $('[name=nome]', root).addEventListener('input', debounce(ver, 250));
  $('[name=especificacao]', root).addEventListener('input', debounce(ver, 250));
  return ver;
}

      <div class="sec-t">Formação do preço</div>
      ${blocoPrecoProduto(p)}
      ${novo ? '' : campoMotivo() + `<div class="sec-t" style="margin-top:20px">${ico('hist')} Histórico de preços</div><div data-hist></div>`}
    </form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="bsp">${ico('check')} Salvar</button>`,
  });
  $$('input[data-money]', m).forEach(i => { if (!i.closest('[data-mat]')) bindMoney(i.parentElement); });
  ligarPrecoProduto(m);
  if (!novo) {
    pintarHistorico($('[data-hist]', m), 'produto', p.id);
    $('[data-preco]', m).addEventListener('input', () => setTimeout(() => $('[data-motivo]', m).classList.toggle('hidden', lerComposicao(m).preco === Number(p.preco_venda)), 0));
  }
  const foto = completo ? bindPhoto(m) : null;
  const dup = ligarDuplicidade(m, produtos, p.id, 'o produto', ex => { m.close(); formProduto(ex, { modo, aoSalvar }); });
  if (!novo) dup();
  $('#bsp', m).onclick = () => {
    const f = $('#fp', m);
    if (!f.reportValidity()) return;
    if (dup()) return toast('Este produto já está cadastrado. Abra o cadastro existente para alterar.', 'bad');
    busy($('#bsp', m), async () => {
      try {
        const dados = {
          nome: f.nome.value.trim(), especificacao: f.especificacao.value.trim(), categoria: f.categoria.value.trim(),
          ...lerPrecoProduto(m),
        };
        if (!novo && f.motivo_alteracao) dados.motivo_alteracao = f.motivo_alteracao.value.trim();
        if (completo) Object.assign(dados, {
          unidade: f.unidade.value.trim() || 'un', fornecedor_id: f.fornecedor_id.value || null,
          estoque_minimo: Math.max(0, parseNum(f.estoque_minimo.value)),
        });
        let salvo;
        if (novo) salvo = await q(sb.from('produtos').insert(dados).select().single());
        else salvo = await q(sb.from('produtos').update(dados).eq('id', p.id).select().single());
        if (foto && (foto.file || foto.remove)) {
          const url = foto.file ? await uploadFoto(foto.file, 'produtos') : null;
          await q(sb.from('produtos').update({ foto_url: url }).eq('id', salvo.id));
          if (p.foto_url) await removerFoto(p.foto_url);
        }
        const qi = novo && completo ? parseNum(f.qtd_inicial.value) : 0;
        if (qi > 0) await q(sb.from('movimentacoes_estoque').insert({
          produto_id: salvo.id, tipo: 'entrada', delta: qi, custo_unitario: salvo.custo,
          fornecedor_id: salvo.fornecedor_id, observacao: 'Estoque inicial' }));
        m.close();
        toast(novo ? (completo ? 'Produto cadastrado.' : 'Produto cadastrado — já disponível no Estoque.') : 'Produto atualizado.', 'ok');
        aoSalvar(salvo);
      } catch (e) { falha(e); }
    });
  };
}

/* =====================================================================
   HISTÓRICO DE PREÇOS (gravado pelo banco a cada alteração)
   ===================================================================== */
async function pintarHistorico(el, tipo, id) {
  if (!el) return;
  el.innerHTML = '<div class="loading" style="padding:16px"><span class="spin"></span></div>';
  try {
    const l = await q(sb.from('historico_precos').select('*').eq(tipo === 'produto' ? 'produto_id' : 'servico_id', id).order('alterado_em', { ascending: false }));
    const prod = tipo === 'produto';
    el.innerHTML = l.length ? `<div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Data</th><th class="num">Custo</th>${prod ? '<th class="num">Lucro</th>' : ''}<th class="num">Preço</th><th class="num">Variação</th><th>Motivo</th></tr></thead><tbody>
      ${l.map(h => { const dif = h.preco_anterior == null ? null : Number(h.preco) - Number(h.preco_anterior), pct = h.preco_anterior > 0 ? dif / h.preco_anterior * 100 : null;
        const comp = prod ? `Materiais ${brl(h.custo_materiais)} + Horas ${brl(h.custo_horas)}${Number(h.valor_hora) || Number(h.horas_trabalhadas) ? ` (${brl(h.valor_hora)} × ${nf(h.horas_trabalhadas)} h)` : ''}` : `${brl(h.valor_hora)} × ${nf(h.horas_trabalhadas)} h`;
        return `<tr><td class="first">${fmtDateTime(h.alterado_em)}</td>
          <td data-l="Custo" class="num">${prod ? brl(h.custo) : '—'}<div style="font-size:11.5px;color:var(--muted);white-space:normal">${comp}</div></td>
          ${prod ? `<td data-l="Lucro" class="num">${nf(h.lucro_percentual)}%</td>` : ''}
          <td data-l="Preço" class="num"><b>${brl(h.preco)}</b></td>
          <td data-l="Variação" class="num">${dif === null ? '<span class="badge">inicial</span>' : dif === 0 ? '<span class="badge">sem mudança</span>' : `<span class="badge ${dif > 0 ? 'warn' : 'ok'}">${dif > 0 ? '▲ +' : '▼ '}${brl(dif)}${pct !== null ? ` (${dif > 0 ? '+' : ''}${nf(pct)}%)` : ''}</span>`}</td>
          <td data-l="Motivo">${esc(h.motivo) || '<span style="color:var(--soft)">—</span>'}</td></tr>`; }).join('')}
      </tbody></table></div></div>` : `<div style="color:var(--muted);font-size:13px">Nenhum registro de preço ainda.</div>`;
  } catch (e) { el.innerHTML = `<div style="color:var(--muted);font-size:13px">${esc(traduzErro(e))}</div>`; }
}
const campoMotivo = () => `<div class="field hidden" data-motivo style="margin-top:12px"><label>Motivo da alteração de preço (opcional)</label>
  <input class="f" name="motivo_alteracao" maxlength="200" placeholder="Ex.: aumento da mão de obra, reajuste do fornecedor…"><span class="hint">Fica registrado no histórico de preços.</span></div>`;

  const [servicos, produtos] = await Promise.all([Dados.servicos(), Dados.produtos()]);
  const s = serv ? (servicos.find(x => x.id === serv.id) || serv) : {};
  const novo = !s.id;
  const m = openModal({
    title: novo ? 'Cadastrar serviço — Base de Cálculo' : 'Editar serviço', size: 'lg',
    body: `<form id="fs" autocomplete="off"><div data-dup></div>
      <div class="grid g3">
        <div class="field"><label>Serviço *</label><input class="f" name="nome" required maxlength="140" value="${esc(s.nome)}" list="dl-serv"></div>
        <div class="field"><label>Especificação</label><input class="f" name="especificacao" maxlength="200" value="${esc(s.especificacao)}"></div>
        <div class="field"><label>Categoria</label><input class="f" name="categoria" list="dl-cat" maxlength="80" value="${esc(s.categoria)}"></div>
      </div>
      <datalist id="dl-cat">${categoriasDe(produtos, servicos).map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <datalist id="dl-serv">${servicos.map(x => `<option value="${esc(x.nome)}">`).join('')}</datalist>
      <div class="sec-t">Formação do preço</div>
      <div class="grid g3">
        <div class="field"><label>Horas (R$) — valor da hora</label><input class="f" data-money name="valor_hora" inputmode="decimal" value="${fmtIn(s.valor_hora ?? 0)}"></div>
        <div class="field"><label>Horas trabalhadas</label><input class="f" data-money name="horas_trabalhadas" inputmode="decimal" value="${fmtIn(s.horas_trabalhadas ?? 0)}"></div>
        <div class="field"><label>Preço final (R$)</label><input class="f" name="preco" readonly></div>
      </div>
      <div class="formula" data-form style="margin-top:12px"></div>
      ${novo ? '' : campoMotivo()}
      <div class="sec-t">Foto (opcional)</div>${photoPicker(s.foto_url)}
      ${novo ? '' : `<div class="sec-t" style="margin-top:20px">${ico('hist')} Histórico de preços</div><div data-hist></div>`}
    </form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="bss">${ico('check')} Salvar</button>`,
  });
  bindMoney(m);
  const foto = bindPhoto(m);
  const f = $('#fs', m);
  const calc = () => {
    const vh = parseNum(f.valor_hora.value), h = parseNum(f.horas_trabalhadas.value), pr = round2(vh * h);
    f.preco.value = brl(pr);
    $('[data-form]', m).innerHTML = `Preço final = Valor da hora × Horas trabalhadas = <b>${brl(vh)}</b> × <b>${nf(h)} h</b> = <b style="color:var(--text)">${brl(pr)}</b>`;
    if (!novo) $('[data-motivo]', m).classList.toggle('hidden', pr === Number(s.preco));
  };
  if (!novo) pintarHistorico($('[data-hist]', m), 'servico', s.id);
  f.valor_hora.addEventListener('input', calc); f.horas_trabalhadas.addEventListener('input', calc); calc();
  const dup = ligarDuplicidade(m, servicos, s.id, 'o serviço', ex => { m.close(); formServico(ex, { aoSalvar }); });
  if (!novo) dup();
  $('#bss', m).onclick = () => {
    if (!f.reportValidity()) return;
    if (dup()) return toast('Este serviço já está cadastrado. Abra o cadastro existente para alterar.', 'bad');
    busy($('#bss', m), async () => {
      try {
        const dados = { nome: f.nome.value.trim(), especificacao: f.especificacao.value.trim(), categoria: f.categoria.value.trim(),
          valor_hora: round2(parseNum(f.valor_hora.value)), horas_trabalhadas: round2(parseNum(f.horas_trabalhadas.value)) };
        if (!novo) dados.motivo_alteracao = f.motivo_alteracao.value.trim();
        let salvo = novo ? await q(sb.from('servicos').insert(dados).select().single())
                         : await q(sb.from('servicos').update(dados).eq('id', s.id).select().single());
        if (foto.file || foto.remove) {
          const url = foto.file ? await uploadFoto(foto.file, 'servicos') : null;
          await q(sb.from('servicos').update({ foto_url: url }).eq('id', salvo.id));
          if (s.foto_url) await removerFoto(s.foto_url);
        }
        m.close();
        toast(novo ? 'Serviço cadastrado — já disponível em Serviços.' : 'Serviço atualizado.', 'ok');
        aoSalvar(salvo);
      } catch (e) { falha(e); }
    });
  };
}

async function excluirProduto(p, depois = recarregar) {
  if (!await confirmar(`Excluir o produto <b>${esc(p.nome)}</b>?<br><br><span style="color:var(--muted);font-size:13px">O histórico de movimentações e de vendas já realizadas é preservado.</span>`, { ok: 'Excluir', danger: true })) return;
  try { await q(sb.from('produtos').delete().eq('id', p.id)); await removerFoto(p.foto_url); toast('Produto excluído.', 'ok'); depois(); }
  catch (e) { falha(e); }
}
async function excluirServico(s, depois = recarregar) {
  if (!await confirmar(`Excluir o serviço <b>${esc(s.nome)}</b>?<br><br><span style="color:var(--muted);font-size:13px">Vendas já realizadas com este serviço são preservadas.</span>`, { ok: 'Excluir', danger: true })) return;
  try { await q(sb.from('servicos').delete().eq('id', s.id)); await removerFoto(s.foto_url); toast('Serviço excluído.', 'ok'); depois(); }
  catch (e) { falha(e); }
}

/* =====================================================================
   MOVIMENTAÇÃO DE ESTOQUE
   ===================================================================== */
async function formMovimentacao({ produtoId = null, fornecedorId = null, tipo = 'entrada', aoSalvar = recarregar } = {}) {
  const [produtos, fornecedores] = await Promise.all([Dados.produtos(), Dados.fornecedores()]);
  if (!produtos.length) return toast('Cadastre um produto antes de registrar movimentações.', 'bad');
  const m = openModal({
    title: 'Movimentar estoque',
    body: `<form id="fm" autocomplete="off">
      <div class="seg" id="mtipo" style="margin-bottom:14px">
        <button type="button" data-t="entrada">${ico('arrowin')} Entrada</button>
        <button type="button" data-t="saida">${ico('arrowout')} Saída</button>
        <button type="button" data-t="ajuste">Ajuste de inventário</button>
      </div>
      <div class="grid g2">
        <div class="field spanall"><label>Produto *</label><select class="f" name="produto_id" required>
          <option value="">Selecione…</option>${produtos.map(p => `<option value="${p.id}" ${p.id === produtoId ? 'selected' : ''}>${esc(p.nome)}${p.especificacao ? ' — ' + esc(p.especificacao) : ''} (${qtdf(p.quantidade)} ${esc(p.unidade)})</option>`).join('')}</select></div>
        <div class="field" data-sh="entrada saida"><label>Quantidade *</label><input class="f" name="qtd" data-money data-dec="q" inputmode="decimal"></div>
        <div class="field" data-sh="ajuste"><label>Quantidade contada (real) *</label><input class="f" name="contada" data-money data-dec="q" inputmode="decimal"></div>
        <div class="field"><label>Data</label><input class="f" type="datetime-local" name="data" value="${toLocalInput()}"></div>
        <div class="field" data-sh="entrada"><label>Custo unitário (R$)</label><input class="f" name="custo" data-money inputmode="decimal"></div>
        <div class="field" data-sh="entrada"><label>Fornecedor</label><select class="f" name="fornecedor_id"><option value="">—</option>${fornecedores.map(f => `<option value="${f.id}" ${f.id === fornecedorId ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></div>
        <div class="field" data-sh="entrada"><label>Nº nota / pedido</label><input class="f" name="documento" maxlength="60"></div>
        <div class="field spanall"><label>Observação</label><input class="f" name="observacao" maxlength="250"></div>
      </div>
      <div class="alert info" id="minfo" style="margin:14px 0 0"></div>
    </form>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="bsm">${ico('check')} Registrar</button>`,
  });
  bindMoney(m);
  const f = $('#fm', m);
  let t = tipo;
  const prodSel = () => produtos.find(p => p.id === f.produto_id.value);
  const info = () => {
    const p = prodSel(), box = $('#minfo', m);
    if (!p) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    let novo = Number(p.quantidade);
    if (t === 'entrada') novo += parseNum(f.qtd.value);
    if (t === 'saida') novo -= parseNum(f.qtd.value);
    if (t === 'ajuste') novo = f.contada.value.trim() === '' ? novo : parseNum(f.contada.value);
    box.className = 'alert ' + (novo < 0 ? 'bad' : 'info');
    box.innerHTML = `Saldo atual: <b>&nbsp;${qtdf(p.quantidade)} ${esc(p.unidade)}</b>&nbsp;→ após registrar: <b>&nbsp;${qtdf(novo)} ${esc(p.unidade)}</b>${novo < 0 ? '&nbsp;(insuficiente)' : ''}`;
    if (t === 'entrada' && !f.custo.dataset.touched) f.custo.value = nf(p.custo);
    if (t === 'entrada' && !f.fornecedor_id.dataset.touched && !fornecedorId) f.fornecedor_id.value = p.fornecedor_id || '';
  };
  const setTipo = nt => {
    t = nt;
    $$('#mtipo button', m).forEach(b => b.classList.toggle('on', b.dataset.t === t));
    $$('[data-sh]', m).forEach(el => el.classList.toggle('hidden', !el.dataset.sh.split(' ').includes(t)));
    info();
  };
  $$('#mtipo button', m).forEach(b => b.onclick = () => setTipo(b.dataset.t));
  f.produto_id.onchange = () => { delete f.custo.dataset.touched; info(); };
  f.custo.addEventListener('input', () => f.custo.dataset.touched = 1);
  f.fornecedor_id.addEventListener('change', () => f.fornecedor_id.dataset.touched = 1);
  [f.qtd, f.contada].forEach(i => i.addEventListener('input', info));
  setTipo(t);
  $('#bsm', m).onclick = () => {
    const p = prodSel();
    if (!p) return toast('Selecione o produto.', 'bad');
    let delta;
    if (t === 'ajuste') {
      if (f.contada.value.trim() === '') return toast('Informe a quantidade contada.', 'bad');
      delta = parseNum(f.contada.value) - Number(p.quantidade);
      if (delta === 0) return toast('A quantidade contada é igual ao saldo atual. Nada a ajustar.');
    } else {
      const qn = parseNum(f.qtd.value);
      if (qn <= 0) return toast('Informe uma quantidade maior que zero.', 'bad');
      delta = t === 'entrada' ? qn : -qn;
    }
    busy($('#bsm', m), async () => {
      try {
        const reg = { produto_id: p.id, tipo: t, delta, observacao: f.observacao.value.trim(),
          data: f.data.value ? new Date(f.data.value).toISOString() : new Date().toISOString() };
        if (t === 'entrada') Object.assign(reg, {
          custo_unitario: f.custo.value.trim() === '' ? null : round2(parseNum(f.custo.value)),
          fornecedor_id: f.fornecedor_id.value || null, documento: f.documento.value.trim() });
        await q(sb.from('movimentacoes_estoque').insert(reg));
        m.close(); toast('Movimentação registrada.', 'ok'); aoSalvar();
      } catch (e) { falha(e); }
    });
  };
}
const TIPO_MOV = { entrada: ['Entrada', 'ok'], saida: ['Saída', 'warn'], ajuste: ['Ajuste', 'info'], venda: ['Venda', 'warn'], cancelamento_venda: ['Venda cancelada', 'info'] };
const badgeMov = t => `<span class="badge ${TIPO_MOV[t]?.[1] || ''}">${TIPO_MOV[t]?.[0] || esc(t)}</span>`;

const Views = {};

/* ----------------------------- ESTOQUE ----------------------------- */
Views.estoque = async (v, args, vivo) => {
  const [produtos, servicos] = await Promise.all([Dados.produtos(), Dados.servicos()]);
  if (!vivo()) return;
  const cats = categoriasDe(produtos);
  const st = { busca: '', cat: '', baixo: args[0] === 'baixo' };
  const nBaixo = produtos.filter(estoqueBaixo).length;
  v.innerHTML = `<div class="page-h"><div><h1>Estoque</h1><p>${produtos.length} produto(s) cadastrado(s)</p></div>
      <div class="actions"><button class="btn" id="bmov">${ico('swap')} Entrada / Saída</button>
      <button class="btn primary" id="bnovo">${ico('plus')} Novo produto</button></div></div>
    ${nBaixo ? `<div class="alert warn">${ico('alert')} <span><b>${nBaixo}</b> produto(s) com estoque igual ou abaixo do mínimo.</span><button class="btn sm" id="bverbaixo">Mostrar</button></div>` : ''}
    <div class="toolbar">
      <div class="search">${ico('search')}<input class="f" id="ebusca" placeholder="Pesquisar por nome ou especificação…"></div>
      <select class="f" id="ecat">${optsCat(cats)}</select>
      <label class="chk"><input type="checkbox" id="ebaixo" ${st.baixo ? 'checked' : ''}> Somente estoque baixo</label>
    </div>
    <div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr>
      <th style="width:58px">Foto</th><th>Produto</th><th>Especificação</th><th>Categoria</th><th class="num">Quantidade</th><th class="num">Custo</th><th class="num">Valor de venda</th><th class="act"></th>
    </tr></thead><tbody id="etb"></tbody></table></div></div>`;
  const tb = $('#etb', v);
  const pintar = () => {
    const b = norm(st.busca);
    const lista = produtos.filter(p => (!b || norm(p.nome + ' ' + p.especificacao).includes(b)) && (!st.cat || p.categoria === st.cat) && (!st.baixo || estoqueBaixo(p)));
    tb.innerHTML = lista.length ? lista.map(p => `<tr class="click" data-id="${p.id}">
      <td class="mh">${thumb(p.foto_url)}</td>
      <td class="first"><div class="prod-cell"><span class="only-m">${thumb(p.foto_url)}</span><div><b>${esc(p.nome)}</b></div></div></td>
      <td data-l="Especificação" class="muted">${esc(p.especificacao) || '—'}</td>
      <td data-l="Categoria">${p.categoria ? `<span class="chip">${esc(p.categoria)}</span>` : '—'}</td>
      <td data-l="Quantidade" class="num"><span class="badge ${estoqueBaixo(p) ? 'bad' : (p.quantidade > 0 ? 'ok' : '')}">${qtdf(p.quantidade)} ${esc(p.unidade)}</span></td>
      <td data-l="Custo" class="num">${brl(p.custo)}</td>
      <td data-l="Venda" class="num"><b>${brl(p.preco_venda)}</b></td>
      <td class="act"><button class="icon-btn" data-a="mov" title="Entrada / saída">${ico('swap')}</button><button class="icon-btn" data-a="edit" title="Editar">${ico('edit')}</button>${isAdmin() ? `<button class="icon-btn bad" data-a="del" title="Excluir">${ico('trash')}</button>` : ''}</td>
    </tr>`).join('') : emptyRow(8, produtos.length ? 'Nenhum produto encontrado com esses filtros.' : 'Nenhum produto cadastrado ainda. Clique em "Novo produto" ou cadastre pela Base de Cálculo.', produtos.length ? 'search' : 'box');
  };
  pintar();
  $('#ebusca', v).oninput = debounce(e => { st.busca = e.target.value; pintar(); }, 150);
  $('#ecat', v).onchange = e => { st.cat = e.target.value; pintar(); };
  $('#ebaixo', v).onchange = e => { st.baixo = e.target.checked; pintar(); };
  if ($('#bverbaixo', v)) $('#bverbaixo', v).onclick = () => { st.baixo = true; $('#ebaixo', v).checked = true; pintar(); };
  $('#bnovo', v).onclick = () => formProduto(null, { modo: 'estoque' }).catch(falha);
  $('#bmov', v).onclick = () => formMovimentacao().catch(falha);
  tb.onclick = e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const p = produtos.find(x => x.id === tr.dataset.id);
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'mov') formMovimentacao({ produtoId: p.id }).catch(falha);
    else if (a === 'edit') formProduto(p, { modo: 'estoque' }).catch(falha);
    else if (a === 'del') excluirProduto(p);
    else detalhesProduto(p.id).catch(falha);
  };
};

async function detalhesProduto(id) {
  const [p, movs, forns] = await Promise.all([
    q(sb.from('produtos').select('*').eq('id', id).single()),
    q(sb.from('movimentacoes_estoque').select('*').eq('produto_id', id).order('data', { ascending: false }).limit(100)),
    Dados.fornecedores(),
  ]);
  const fn = Object.fromEntries(forns.map(f => [f.id, f.nome]));
  const luc = p.preco_venda - p.custo;
  const m = openModal({
    title: 'Detalhes do produto', size: 'lg', dismiss: true,
    body: `<div class="det-head">${p.foto_url ? `<img class="big" src="${esc(p.foto_url)}" alt="">` : `<div class="big">${ico('box')}</div>`}
      <div style="flex:1;min-width:0"><h2>${esc(p.nome)}</h2><div class="muted" style="color:var(--muted)">${esc(p.especificacao)}</div>
      <div style="margin-top:6px">${p.categoria ? `<span class="chip">${esc(p.categoria)}</span>` : ''} ${estoqueBaixo(p) ? '<span class="badge bad">Estoque baixo</span>' : ''}</div>
      <div class="dl">
        <div><small>Disponível</small><b>${qtdf(p.quantidade)} ${esc(p.unidade)}</b></div>
        <div><small>Estoque mínimo</small><b>${qtdf(p.estoque_minimo)}</b></div>
        <div><small>Fornecedor principal</small><b>${esc(fn[p.fornecedor_id] || '—')}</b></div>
        <div><small>Custo</small><b>${brl(p.custo)}</b></div>
        <div><small>Valor de venda</small><b>${brl(p.preco_venda)}</b></div>
        <div><small>Lucro por unidade</small><b style="color:${luc < 0 ? 'var(--bad)' : 'var(--ok)'}">${brl(luc)} (${nf(p.lucro_percentual)}%)</b></div>
      </div></div></div>
      ${compoDetalhe(p)}
      <div class="sec-t" style="margin-top:20px">${ico('hist')} Histórico de preços</div><div data-hist></div>
      <div class="sec-t" style="margin-top:20px">Movimentações</div>
      <div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Data</th><th>Tipo</th><th class="num">Qtd</th><th class="num">Saldo</th><th class="num">Custo unit.</th><th>Fornecedor / obs.</th></tr></thead><tbody>
      ${movs.length ? movs.map(mv => `<tr><td class="first">${fmtDateTime(mv.data)}</td><td data-l="Tipo">${badgeMov(mv.tipo)}</td>
        <td data-l="Qtd" class="num">${mv.delta > 0 ? '+' : ''}${qtdf(mv.delta)}</td><td data-l="Saldo" class="num">${qtdf(mv.saldo_apos)}</td>
        <td data-l="Custo unit." class="num">${mv.custo_unitario != null ? brl(mv.custo_unitario) : '—'}</td>
        <td data-l="Detalhe" class="muted">${esc([fn[mv.fornecedor_id], mv.documento && 'Doc. ' + mv.documento, mv.observacao].filter(Boolean).join(' · ')) || '—'}</td></tr>`).join('')
        : emptyRow(6, 'Nenhuma movimentação.', 'swap')}</tbody></table></div></div>`,
    foot: `${isAdmin() ? `<button class="btn danger" id="dpdel" style="margin-right:auto">${ico('trash')} Excluir</button>` : ''}
      <button class="btn" id="dpmov">${ico('swap')} Entrada / Saída</button><button class="btn primary" id="dped">${ico('edit')} Editar</button>`,
  });
  pintarHistorico($('[data-hist]', m), 'produto', p.id);
  const reabrir = () => { recarregar(); };
  $('#dpmov', m).onclick = () => { m.close(); formMovimentacao({ produtoId: p.id, aoSalvar: () => { reabrir(); detalhesProduto(p.id).catch(falha); } }).catch(falha); };
  $('#dped', m).onclick = () => { m.close(); formProduto(p, { modo: 'estoque' }).catch(falha); };
  if ($('#dpdel', m)) $('#dpdel', m).onclick = () => { m.close(); excluirProduto(p); };
}

/* ----------------------------- SERVIÇOS ---------------------------- */
Views.servicos = async (v, _, vivo) => {
  const servicos = await Dados.servicos();
  if (!vivo()) return;
  const cats = categoriasDe(servicos);
  const st = { busca: '', cat: '' };
  v.innerHTML = `<div class="page-h"><div><h1>Serviços</h1><p>O cadastro e a formação de preço dos serviços são feitos na Base de Cálculo.</p></div>
      <div class="actions"><a class="btn primary" href="#/base/servico/novo">${ico('calc')} Cadastrar na Base de Cálculo</a></div></div>
    <div class="toolbar"><div class="search">${ico('search')}<input class="f" id="sbusca" placeholder="Pesquisar serviço…"></div>
      <select class="f" id="scat">${optsCat(cats)}</select></div>
    <div id="sgrid"></div>`;
  const pintar = () => {
    const b = norm(st.busca);
    const lista = servicos.filter(s => (!b || norm(s.nome + ' ' + s.especificacao).includes(b)) && (!st.cat || s.categoria === st.cat));
    $('#sgrid', v).innerHTML = lista.length ? `<div class="svc-grid">${lista.map(s => `<div class="card svc" data-id="${s.id}">
        <div class="ph">${s.foto_url ? `<img src="${esc(s.foto_url)}" alt="" loading="lazy">` : ico('tool')}</div>
        <div class="bd"><b>${esc(s.nome)}</b><small>${esc(s.especificacao) || '&nbsp;'}</small>
          <div class="ft">${s.categoria ? `<span class="chip">${esc(s.categoria)}</span>` : '<span></span>'}<span class="price">${brl(s.preco)}</span></div></div></div>`).join('')}</div>`
      : `<div class="card"><div class="empty">${ico(servicos.length ? 'search' : 'tool')}<div>${servicos.length ? 'Nenhum serviço encontrado.' : 'Nenhum serviço cadastrado. Use "Cadastrar na Base de Cálculo".'}</div></div></div>`;
  };
  pintar();
  $('#sbusca', v).oninput = debounce(e => { st.busca = e.target.value; pintar(); }, 150);
  $('#scat', v).onchange = e => { st.cat = e.target.value; pintar(); };
  $('#sgrid', v).onclick = e => { const c = e.target.closest('[data-id]'); if (c) detalhesServico(servicos.find(s => s.id === c.dataset.id)); };
};
