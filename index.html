const ST_ORC = { aberto: ['Aberto', 'info'], enviado: ['Enviado', 'info'], aprovado: ['Aprovado', 'ok'], recusado: ['Recusado', 'bad'], convertido: ['Convertido em venda', ''] };
const orcVencido = o => ['aberto', 'enviado'].includes(o.status) && o.validade && o.validade < hojeISO();
const badgeOrc = o => `<span class="badge ${ST_ORC[o.status][1]}">${ST_ORC[o.status][0]}</span>${orcVencido(o) ? ' <span class="badge warn">Validade vencida</span>' : ''}`;

Views.orcamentos = async (v, args, vivo) => {
  if (args[0] === 'novo') return telaOrcamento(v, null, vivo);
  if (args[0]) return telaOrcamento(v, args[0], vivo);
  const orcs = await q(sb.from('orcamentos').select('*').order('data', { ascending: false }));
  if (!vivo()) return;
  const st = { busca: '', status: '' };
  const cont = k => orcs.filter(o => o.status === k).length;
  v.innerHTML = `<div class="page-h"><div><h1>Orçamentos</h1><p>Monte orçamentos com os produtos e serviços cadastrados.</p></div>
      <div class="actions"><a class="btn primary" href="#/orcamentos/novo">${ico('plus')} Novo orçamento</a></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="ic">${ico('file')}</div><div><small>Em aberto / enviados</small><b>${cont('aberto') + cont('enviado')}</b></div></div>
      <div class="card kpi"><div class="ic ok">${ico('check')}</div><div><small>Aprovados (aguardando venda)</small><b>${cont('aprovado')}</b></div></div>
      <div class="card kpi"><div class="ic">${ico('cart')}</div><div><small>Convertidos em venda</small><b>${cont('convertido')}</b></div></div>
      <div class="card kpi"><div class="ic">${ico('money')}</div><div><small>Valor em aberto</small><b>${brl(orcs.filter(o => ['aberto', 'enviado', 'aprovado'].includes(o.status)).reduce((s, o) => s + Number(o.total), 0))}</b></div></div></div>
    <div class="toolbar"><div class="search">${ico('search')}<input class="f" id="obusca" placeholder="Pesquisar por nº ou cliente…"></div>
      <select class="f" id="ost"><option value="">Todas as situações</option>${Object.entries(ST_ORC).map(([k, x]) => `<option value="${k}">${x[0]}</option>`).join('')}</select></div>
    <div class="card"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Validade</th><th class="num">Total</th><th>Situação</th></tr></thead><tbody id="otb"></tbody></table></div></div>`;
  const pintar = () => {
    const b = norm(st.busca);
    const l = orcs.filter(o => (!b || norm(o.cliente_nome).includes(b) || String(o.numero) === b.replace(/\D/g, '')) && (!st.status || o.status === st.status));
    $('#otb', v).innerHTML = l.length ? l.map(o => `<tr class="click" data-id="${o.id}"><td class="first"><b>Nº ${o.numero}</b></td><td data-l="Data">${fmtDate(o.data)}</td>
      <td data-l="Cliente">${esc(o.cliente_nome) || '—'}</td><td data-l="Validade">${fmtDate(o.validade)}</td><td data-l="Total" class="num"><b>${brl(o.total)}</b></td><td data-l="Situação">${badgeOrc(o)}</td></tr>`).join('')
      : emptyRow(6, orcs.length ? 'Nenhum orçamento com esses filtros.' : 'Nenhum orçamento ainda. Clique em "Novo orçamento".', 'file');
  };
  pintar();
  $('#obusca', v).oninput = debounce(e => { st.busca = e.target.value; pintar(); }, 150);
  $('#ost', v).onchange = e => { st.status = e.target.value; pintar(); };
  $('#otb', v).onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) detalhesOrcamento(tr.dataset.id).catch(falha); };
};

async function telaOrcamento(v, id, vivo) {
  const [produtos, servicos, clientes] = await Promise.all([Dados.produtos(), Dados.servicos(), Dados.clientes()]);
  let o = null, itens = [];
  if (id) {
    [o, itens] = await Promise.all([q(sb.from('orcamentos').select('*').eq('id', id).single()), q(sb.from('orcamento_itens').select('*').eq('orcamento_id', id))]);
    if (o.status === 'convertido') { toast('Este orçamento já foi convertido em venda e não pode ser alterado.', 'bad'); location.hash = '#/orcamentos'; return; }
  }
  if (!vivo()) return;
  let removidos = 0;
  const est = o ? { cliente_id: o.cliente_id || '', desconto_tipo: o.desconto_tipo, desconto_valor: Number(o.desconto_valor),
    itens: itens.map(i => { const x = i.tipo === 'produto' ? produtos.find(p => p.id === i.produto_id) : servicos.find(s => s.id === i.servico_id);
      if (!x) { removidos++; return null; }
      return { tipo: i.tipo, id: x.id, nome: x.nome, esp: x.especificacao, preco: Number(i.tipo === 'produto' ? x.preco_venda : x.preco), qtd: Number(i.quantidade), estoque: Number(x.quantidade ?? Infinity) }; }).filter(Boolean) } : {};
  const validade = o?.validade || new Date(Date.now() + 15 * 864e5 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  v.innerHTML = `<div class="page-h"><div><h1>${o ? `Editar orçamento nº ${o.numero}` : 'Novo orçamento'}</h1><p>Os valores usam os preços atuais da Base de Cálculo.</p></div>
    <div class="actions"><a class="btn" href="#/orcamentos">Voltar</a></div></div>
    ${removidos ? `<div class="alert warn">${ico('alert')} ${removidos} item(ns) deste orçamento foram excluídos do cadastro e saíram da lista.</div>` : ''}
    ${o && itens.some(i => { const x = i.tipo === 'produto' ? produtos.find(p => p.id === i.produto_id) : servicos.find(s => s.id === i.servico_id); return x && Number(i.tipo === 'produto' ? x.preco_venda : x.preco) !== Number(i.preco_unitario); }) ? `<div class="alert info">${ico('alert')} Algum preço mudou desde a criação. Ao salvar, o orçamento passa a usar os preços atuais.</div>` : ''}
    <div id="oed"></div>`;
  const el = $('#oed', v);
  const ed = montarEditor(el, { produtos, servicos, clientes, modo: 'orcamento', estado: est,
    extra: `<div class="card"><div class="card-h"><h3>Condições</h3></div><div class="card-b"><div class="grid g3">
      <div class="field"><label>Validade</label><input class="f" type="date" id="oval" value="${validade}"></div>
      <div class="field"><label>Situação</label><select class="f" id="ostat">${['aberto', 'enviado', 'aprovado', 'recusado'].map(k => `<option value="${k}" ${o?.status === k ? 'selected' : ''}>${ST_ORC[k][0]}</option>`).join('')}</select></div>
      <div class="field spanall"><label>Observação (aparece no PDF)</label><textarea class="f" id="oobs" maxlength="1000">${esc(o?.observacao || '')}</textarea></div></div></div></div>`,
    acoes: `<button class="btn primary big" id="osalvar" type="button">${ico('check')} SALVAR ORÇAMENTO</button>` });
  $('#osalvar', el).onclick = () => {
    if (!ed.validar()) return;
    busy($('#osalvar', el), async () => {
      try {
        const nid = await q(sb.rpc('salvar_orcamento', { p: { id: o?.id || null, ...ed.payload(), validade: $('#oval', el).value || null, status: $('#ostat', el).value, observacao: $('#oobs', el).value.trim() } }));
        toast(o ? 'Orçamento atualizado.' : 'Orçamento criado.', 'ok');
        location.hash = '#/orcamentos';
        setTimeout(() => detalhesOrcamento(nid).catch(falha), 300);
      } catch (e) { falha(e); }
    });
  };
}

async function detalhesOrcamento(id) {
  const [o, itens] = await Promise.all([q(sb.from('orcamentos').select('*').eq('id', id).single()), q(sb.from('orcamento_itens').select('*').eq('orcamento_id', id))]);
  const conv = o.status === 'convertido';
  const venda = conv && o.venda_id ? (await q(sb.from('vendas').select('id,numero').eq('id', o.venda_id))).at(0) : null;
  const m = openModal({ title: `Orçamento nº ${o.numero}`, size: 'lg', dismiss: true,
    body: `<div class="dl" style="margin:0 0 16px"><div><small>Data</small><b>${fmtDate(o.data)}</b></div><div><small>Cliente</small><b>${esc(o.cliente_nome) || '—'}</b></div>
        <div><small>Validade</small><b>${fmtDate(o.validade)}</b></div><div><small>Situação</small><b>${badgeOrc(o)}</b></div>
        ${venda ? `<div><small>Venda gerada</small><b><a href="#" id="dovenda">Venda nº ${venda.numero}</a></b></div>` : ''}
        ${o.observacao ? `<div class="span2"><small>Observação</small><b style="font-weight:400">${esc(o.observacao)}</b></div>` : ''}</div>
      <div class="card" style="box-shadow:none"><div class="tbl-wrap"><table class="t resp"><thead><tr><th>Item</th><th class="num">Qtd</th><th class="num">Valor unitário</th><th class="num">Total</th></tr></thead><tbody>
      ${itens.map(i => `<tr><td class="first"><span class="badge ${i.tipo === 'produto' ? 'info' : 'ok'}">${i.tipo === 'produto' ? 'Produto' : 'Serviço'}</span> ${esc(i.descricao)}${i.especificacao ? ` <span style="color:var(--muted)">— ${esc(i.especificacao)}</span>` : ''}</td>
        <td data-l="Qtd" class="num">${qtdf(i.quantidade)}</td><td data-l="Valor unitário" class="num">${brl(i.preco_unitario)}</td><td data-l="Total" class="num">${brl(i.total)}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="tot-box"><div class="rs"><span>Subtotal</span><b>${brl(o.subtotal)}</b></div><div class="rs"><span>${descontoTxt(o)}</span><b>- ${brl(o.desconto_total)}</b></div><div class="rs total"><span>Valor total</span><b>${brl(o.total)}</b></div></div>
      ${!conv ? `<div class="sec-t">Alterar situação</div><div class="inline" style="max-width:420px"><select class="f" id="dost">${['aberto', 'enviado', 'aprovado', 'recusado'].map(k => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${ST_ORC[k][0]}</option>`).join('')}</select><button class="btn" id="dostok">Salvar situação</button></div>` : ''}`,
    foot: `${!conv && isAdmin() ? `<button class="btn danger" id="dodel" style="margin-right:auto">${ico('trash')} Excluir</button>` : ''}
      <button class="btn" id="domail">${ico('mail')} Enviar por e-mail</button><button class="btn" id="dopdf">${ico('file')} PDF</button>
      ${!conv ? `<a class="btn" href="#/orcamentos/${o.id}" id="doed">${ico('edit')} Editar</a>` : ''}
      ${o.status === 'aprovado' ? `<button class="btn primary" id="doconv">${ico('cart')} Converter em venda</button>` : ''}` });
  $('#dopdf', m).onclick = () => busy($('#dopdf', m), async () => { try { const d = await pdfOrcamento(id); baixar(new Blob([d.bytes], { type: 'application/pdf' }), d.nome); } catch (e) { falha(e); } });
  $('#domail', m).onclick = () => busy($('#domail', m), async () => { try { const d = await pdfOrcamento(id); const ok = await enviarPorEmail({ tipo: 'orcamento', id, numero: o.numero, cliente: d.cliente, doc: d });
    if (ok && o.status === 'aberto') { await sb.from('orcamentos').update({ status: 'enviado' }).eq('id', id); } } catch (e) { falha(e); } });
  if ($('#doed', m)) $('#doed', m).onclick = () => m.close();
  if ($('#dovenda', m)) $('#dovenda', m).onclick = e => { e.preventDefault(); m.close(); detalhesVenda(venda.id).catch(falha); };
  if ($('#dostok', m)) $('#dostok', m).onclick = () => busy($('#dostok', m), async () => {
    try { await q(sb.from('orcamentos').update({ status: $('#dost', m).value }).eq('id', id)); m.close(); toast('Situação atualizada.', 'ok'); recarregar(); }
    catch (e) { falha(e); } });
  if ($('#dodel', m)) $('#dodel', m).onclick = async () => {
    if (!await confirmar(`Excluir o orçamento nº ${o.numero}?`, { ok: 'Excluir', danger: true })) return;
    try { await q(sb.from('orcamentos').delete().eq('id', id)); m.close(); toast('Orçamento excluído.', 'ok'); recarregar(); } catch (e) { falha(e); } };
  if ($('#doconv', m)) $('#doconv', m).onclick = () => { m.close(); converterOrcamento(o); };
}

function converterOrcamento(o) {
  const m = openModal({ title: `Converter orçamento nº ${o.numero} em venda`, size: 'lg',
    body: `<div class="alert info">${ico('alert')} A venda usará os itens e valores combinados neste orçamento (${brl(o.total)}). O estoque dos produtos é baixado ao confirmar.</div>${blocoPagamento()}`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="cvok">${ico('check')} Confirmar venda</button>` });
  const pag = ligarPagamento(m, () => Number(o.total));
  $('#cvok', m).onclick = () => busy($('#cvok', m), async () => {
    try { const id = await q(sb.rpc('registrar_venda', { p: { orcamento_id: o.id, ...pag.dados() } })); m.close(); toast('Orçamento convertido em venda.', 'ok'); await posVenda(id, () => { location.hash = '#/vendas'; recarregar(); }); }
    catch (e) { falha(e); }
  });
}

Views.financeiro = async (v, args, vivo) => {
  const [parcelas, vendas, clientes] = await Promise.all([q(sb.from('v_parcelas').select('*').order('vencimento')), q(sb.from('vendas').select('*').order('data', { ascending: false })), Dados.clientes()]);
  if (!vivo()) return;
  const ativas = parcelas.filter(p => p.venda_status === 'confirmada');
  const vconf = vendas.filter(x => x.status === 'confirmada');
  const mes = mesDe(new Date());
  const pv = {}; ativas.forEach(p => (pv[p.venda_id] = pv[p.venda_id] || []).push(p));
  const st = { aba: args[0] === 'vendas' ? 'vendas' : 'contas', busca: '', cliente: '', sit: 'aberto', de: '', ate: '' };
  v.innerHTML = `<div class="page-h"><div><h1>Financeiro</h1><p>Contas a receber, pagamentos e histórico por cliente.</p></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="ic ok">${ico('check')}</div><div><small>Recebido no mês</small><b>${brl(ativas.filter(p => p.pago_em && mesDe(p.pago_em) === mes).reduce((s, p) => s + Number(p.valor_pago), 0))}</b></div></div>
      <div class="card kpi"><div class="ic">${ico('money')}</div><div><small>A receber (em dia)</small><b>${brl(ativas.filter(p => p.situacao !== 'vencido').reduce((s, p) => s + Number(p.saldo), 0))}</b></div></div>
      <div class="card kpi click" id="fkv"><div class="ic warn">${ico('alert')}</div><div><small>Vencido</small><b>${brl(ativas.filter(p => p.situacao === 'vencido').reduce((s, p) => s + Number(p.saldo), 0))}</b></div></div>
      <div class="card kpi"><div class="ic">${ico('cart')}</div><div><small>Vendido no mês</small><b>${brl(vconf.filter(x => mesDe(x.data) === mes).reduce((s, x) => s + Number(x.total), 0))}</b></div></div></div>
    <div class="toolbar">
      <div class="seg" id="faba"><button data-a="contas">Contas a receber</button><button data-a="vendas">Vendas realizadas</button></div>
      <div class="search">${ico('search')}<input class="f" id="fbusca" placeholder="Nº da venda ou cliente…"></div>
      <select class="f" id="fcli"><option value="">Todos os clientes</option>${clientes.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select>
      <select class="f" id="fsit"><option value="aberto">Em aberto (pendente, parcial, vencido)</option><option value="">Todas</option>${Object.entries(SIT).map(([k, x]) => `<option value="${k}">${x[0]}</option>`).join('')}</select>
      <span class="inline datas" style="gap:6px"><input class="f" type="date" id="fde" title="Vencimento a partir de"><span style="color:var(--muted)">até</span><input class="f" type="date" id="fate" title="Vencimento até"></span>
    </div>
    <div id="fcliresumo"></div>
    <div class="card"><div class="tbl-wrap" id="fconteudo"></div></div>`;
  const pintar = () => {
    $$('#faba button', v).forEach(b => b.classList.toggle('on', b.dataset.a === st.aba));
    $('#fde', v).parentElement.classList.toggle('hidden', st.aba !== 'contas');
    const b = norm(st.busca), num = b.replace(/\D/g, '');

/* =====================================================================
   DASHBOARD
   ===================================================================== */
const COR_FAT = '#2f62b0', COR_LUC = '#c2771f';
function graficoMensal(dados) {
  // dados: [{mes, fat, luc, n}] — barras agrupadas, um único eixo em R$
  const W = 760, H = 260, L = 64, R = 12, T = 14, B = 30;
  const max = Math.max(1, ...dados.map(d => Math.max(d.fat, d.luc))), min = Math.min(0, ...dados.map(d => d.luc));
  const passo = (() => { const bruto = (max - min) / 4, p = Math.pow(10, Math.floor(Math.log10(bruto || 1))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= bruto) || bruto; })();
  const topo = Math.ceil(max / passo) * passo, base = Math.floor(min / passo) * passo;
  const y = vv => T + (topo - vv) / (topo - base || 1) * (H - T - B);
  const gw = (W - L - R) / dados.length, bw = Math.min(18, (gw - 10) / 2);
  const ticks = []; for (let t = base; t <= topo + 1e-9; t += passo) ticks.push(t);
  const curto = vv => Math.abs(vv) >= 1000 ? 'R$ ' + (vv / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : 'R$ ' + vv.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  const barra = (x, v0, cor) => { const y0 = y(0), y1 = y(v0), h = Math.abs(y1 - y0); if (h < 0.5) return ''; const r = Math.min(4, h, bw / 2);
    return v0 >= 0 ? `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z" fill="${cor}"/>`
      : `<path d="M${x},${y0} V${y1 - r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 - r} V${y0} Z" fill="${cor}"/>`; };
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Faturamento e lucro estimado por mês">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? '#c9c5bc' : '#ecebe6'}" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" class="ax">${curto(t)}</text>`).join('')}
    ${dados.map((d, i) => { const gx = L + i * gw + (gw - 2 * bw - 2) / 2;
      return `<g class="gm" data-i="${i}"><rect x="${L + i * gw}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent"/>${barra(gx, d.fat, COR_FAT)}${barra(gx + bw + 2, d.luc, COR_LUC)}
        <text x="${L + i * gw + gw / 2}" y="${H - 10}" text-anchor="middle" class="ax">${rotMes(d.mes)}</text></g>`; }).join('')}
  </svg><div class="tip hidden"></div></div>
  <div class="legend"><span><i style="background:${COR_FAT}"></i>Faturamento</span><span><i style="background:${COR_LUC}"></i>Lucro estimado</span></div>`;
}
function ligarGrafico(el, dados) {
  const tip = $('.tip', el), wrap = $('.chart-wrap', el);
  $$('.gm', el).forEach(g => {
    g.addEventListener('mouseenter', () => { const d = dados[+g.dataset.i]; g.classList.add('on');
      tip.innerHTML = `<b>${rotMes(d.mes)}</b><div><i style="background:${COR_FAT}"></i>Faturamento <span>${brl(d.fat)}</span></div><div><i style="background:${COR_LUC}"></i>Lucro estimado <span>${brl(d.luc)}</span></div><div style="color:var(--muted)">${d.n} venda(s)</div>`;
      tip.classList.remove('hidden'); });
    g.addEventListener('mousemove', e => { const r = wrap.getBoundingClientRect(); let x = e.clientX - r.left + 14; if (x + 200 > r.width) x -= 228; tip.style.left = x + 'px'; tip.style.top = (e.clientY - r.top - 10) + 'px'; });
    g.addEventListener('mouseleave', () => { g.classList.remove('on'); tip.classList.add('hidden'); });
  });
}

      ${temProd() ? `<div class="card"><div class="card-h"><h3>Estoque baixo</h3><a class="btn sm" href="#/estoque/baixo">Ver todos</a></div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>Produto</th><th class="num">Disponível</th><th class="num">Mínimo</th></tr></thead><tbody>
        ${baixos.length ? baixos.slice(0, 6).map(p => `<tr><td>${esc(p.nome)}${p.especificacao ? `<div class="muted" style="font-size:12.5px">${esc(p.especificacao)}</div>` : ''}</td>
          <td class="num"><span class="badge bad">${qtdf(p.quantidade)} ${esc(p.unidade)}</span></td><td class="num muted">${qtdf(p.estoque_minimo)}</td></tr>`).join('')
          : emptyRow(3, 'Nenhum produto abaixo do estoque mínimo.', 'check')}</tbody></table></div></div>` : ''}
      <div class="card"><div class="card-h"><h3>Últimas vendas</h3><a class="btn sm" href="#/vendas">Vendas</a></div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>Nº</th><th>Cliente</th><th class="num">Total</th><th>Pagamento</th></tr></thead><tbody>
        ${conf.length ? conf.slice(0, 6).map(x => `<tr class="click" data-venda="${x.id}"><td>Nº ${x.numero}</td><td>${esc(x.cliente_nome) || '—'}</td><td class="num">${brl(x.total)}</td><td>${badgeSit(sitVenda(pv[x.id]))}</td></tr>`).join('')
          : emptyRow(4, 'Nenhuma venda registrada ainda.', 'cart')}</tbody></table></div></div>
    </div>`;
  if (serie.some(s => s.n)) ligarGrafico($('#dgraf', v), serie);
  $$('[data-go]', v).forEach(c => { const mod = c.dataset.go.split('/')[0];
    if (moduloAtivo(mod)) c.onclick = () => location.hash = '#/' + c.dataset.go;
    else if (mod === 'relatorios') c.classList.remove('click'); else c.remove(); });
  $$('a[href^="#/"]', v).forEach(a => { if (!moduloAtivo(a.getAttribute('href').slice(2).split('/')[0])) a.remove(); });
  $$('[data-venda]', v).forEach(r => r.onclick = () => detalhesVenda(r.dataset.venda).catch(falha));
};

/* Aplicativo instalável (tela de início do celular / computador) */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
iniciar();
</script>
</body>
</html>
